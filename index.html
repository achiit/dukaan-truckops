  /* ============================================================== reports */
  function rangeFor(period) {
    const t = todayISO();
    if (period === "month") return { from: t.slice(0, 8) + "01", to: t, label: monthLabel(thisMonth()) };
    if (period === "lastmonth") { const k = addMonthsKey(thisMonth(), -1); return { from: k + "-01", to: k + "-31", label: monthLabel(k) }; }
    if (period === "quarter") return { from: addDays(t, -89), to: t, label: "Last 90 days" };
    if (period === "year") return { from: t.slice(0, 4) + "-01-01", to: t, label: "This year " + t.slice(0, 4) };
    if (period === "custom" && ui.range) return { from: ui.range.from, to: ui.range.to, label: fmtDateShort(ui.range.from) + " – " + fmtDateShort(ui.range.to) };
    const all = [].concat(db.trips.map((x) => x.startDate || ""), db.diesel.map((x) => x.date || ""), db.payments.map((x) => x.date || ""), [todayISO()]).filter(Boolean).sort();
    return { from: all[0] || "2000-01-01", to: t, label: "All time" };
  }
  const inRange = (iso, r) => !!iso && iso >= r.from && iso <= r.to;

  RENDER.reports = function () {
    const period = ui.period || "month";
    const r = rangeFor(period);
    const trips = db.trips.filter((t) => t.status === "delivered" && inRange(t.endDate || t.startDate, r));
    const revenue = sum(trips, (t) => num(t.freight));
    const collected = sum(db.payments.filter((p) => inRange(p.date, r)), (p) => num(p.amount));
    const fuel = sum(db.diesel.filter((d) => inRange(d.date, r)), (d) => num(d.amount));
    const service = sum(db.maint.filter((m) => inRange(m.date, r)), (m) => num(m.cost));
    const other = sum(db.expenses.filter((e) => inRange(e.date, r)), (e) => num(e.amount));
    const cost = fuel + service + other;
    const net = revenue - cost;
    const km = sum(trips, (t) => num(t.distance));
    const margin = revenue ? (net / revenue) * 100 : 0;

    let html = '<div class="toolbar">' +
      '<div class="tabs">' + [["month", "This month"], ["lastmonth", "Last month"], ["quarter", "90 days"], ["year", "This year"], ["all", "All time"], ["custom", "Custom"]]
        .map((p) => '<button class="tab ' + (period === p[0] ? "on" : "") + '" data-act="period" data-p="' + p[0] + '">' + p[1] + "</button>").join("") + "</div>" +
      (period === "custom" ? '<input type="date" class="pick" data-act="range-from" value="' + esc((ui.range && ui.range.from) || addDays(todayISO(), -30)) + '">' +
        '<span class="muted sm">to</span><input type="date" class="pick" data-act="range-to" value="' + esc((ui.range && ui.range.to) || todayISO()) + '">' : "") +
      '<div class="right"><button class="btn" data-act="ai-report">' + I("sparkle", "sm") + ' AI analysis</button>' +
      '<button class="btn" data-act="print">' + I("print", "sm") + ' Print</button>' +
      '<button class="btn primary" data-act="export-pl">' + I("download", "sm") + " Export P&amp;L</button></div></div>";

    html += '<div class="card mb"><div class="card-h"><h3>Profit &amp; loss</h3><span class="sub">' + esc(r.label) + '</span>' +
      '<div class="right"><span class="badge ' + (net >= 0 ? "b-green" : "b-red") + '">' + (margin >= 0 ? "+" : "") + margin.toFixed(1) + "% margin</span></div></div>" +
      '<div class="card-b"><div class="grid g-3" style="gap:18px">' +
      '<div>' + statLine("Freight billed", money(revenue), "pos") + statLine("Collected", money(collected)) + statLine("Receivable now", money(outstandingTotal())) + "</div>" +
      '<div>' + statLine("Diesel", money(fuel)) + statLine("Maintenance", money(service)) + statLine("Other expenses", money(other)) + "</div>" +
      '<div>' + statLine("Total cost", money(cost)) + statLine("Net profit", money(net), net >= 0 ? "pos" : "neg") + statLine("Trips / km", trips.length + (km ? " · " + INR.format(km) + " km" : "")) + "</div>" +
      "</div></div></div>";

    /* per-truck */
    const generalExp = sum(db.expenses.filter((e) => !e.truckId && inRange(e.date, r)), (e) => num(e.amount));
    const perTruck = db.trucks.map((t) => {
      const tt = trips.filter((x) => x.truckId === t.id);
      const rev = sum(tt, (x) => num(x.freight));
      const f = sum(db.diesel.filter((d) => d.truckId === t.id && inRange(d.date, r)), (d) => num(d.amount));
      const s = sum(db.maint.filter((m) => m.truckId === t.id && inRange(m.date, r)), (m) => num(m.cost));
      const o = sum(db.expenses.filter((e) => e.truckId === t.id && inRange(e.date, r)), (e) => num(e.amount));
      const k = sum(tt, (x) => num(x.distance));
      const eff = fuelEfficiency(t.id);
      return { t, trips: tt.length, rev, f, s, o, cost: f + s + o, profit: rev - f - s - o, km: k, eff };
    }).sort((a, b) => b.profit - a.profit);

    html += '<div class="card mb"><div class="card-h"><h3>Per-truck profitability</h3><span class="sub">' + esc(r.label) + "</span></div>" +
      '<div class="card-b tight"><div class="tbl-wrap"><table class="tbl rep-tbl"><thead><tr><th>Truck</th><th class="num">Trips</th><th class="num">Km</th><th class="num">Freight</th><th class="num">Diesel</th><th class="num">Service</th><th class="num">Other</th><th class="num">Profit</th><th class="num">Margin</th><th class="num">km/l</th></tr></thead><tbody>' +
      (perTruck.length ? perTruck.map((x) => "<tr><td><div class=\"t-main mono\">" + esc(x.t.regNo) + '</div><div class="t-sub">' + esc(x.t.model || "") + "</div></td>" +
        '<td class="num mono">' + x.trips + '</td><td class="num mono">' + (x.km ? INR.format(x.km) : "—") + "</td>" +
        '<td class="num mono">' + money(x.rev) + '</td><td class="num mono">' + money(x.f) + '</td><td class="num mono">' + money(x.s) + '</td><td class="num mono">' + money(x.o) + "</td>" +
        '<td class="num mono" style="font-weight:650;color:' + (x.profit >= 0 ? "var(--green)" : "var(--red)") + '">' + money(x.profit) + "</td>" +
        '<td class="num mono">' + (x.rev ? ((x.profit / x.rev) * 100).toFixed(0) + "%" : "—") + '</td><td class="num mono">' + (x.eff ? x.eff.toFixed(1) : "—") + "</td></tr>").join("")
        : '<tr><td colspan="10"><div class="empty"><p>No trucks to report on.</p></div></td></tr>') +
      (generalExp > 0 ? '<tr><td><div class="t-main">General</div><div class="t-sub">not tied to a truck</div></td><td class="num mono">—</td><td class="num mono">—</td><td class="num mono">—</td><td class="num mono">—</td><td class="num mono">—</td><td class="num mono">' + money(generalExp) + '</td><td class="num mono" style="font-weight:650;color:var(--red)">' + money(-generalExp) + '</td><td class="num mono">—</td><td class="num mono">—</td></tr>' : "") +
      "</tbody>" + (perTruck.length ? '<tfoot><tr style="background:var(--panel-2);font-weight:700"><td>Total</td>' +
        '<td class="num mono">' + sum(perTruck, (x) => x.trips) + '</td><td class="num mono">' + (sum(perTruck, (x) => x.km) ? INR.format(sum(perTruck, (x) => x.km)) : "—") + "</td>" +
        '<td class="num mono">' + money(sum(perTruck, (x) => x.rev)) + '</td><td class="num mono">' + money(sum(perTruck, (x) => x.f)) + "</td>" +
        '<td class="num mono">' + money(sum(perTruck, (x) => x.s)) + '</td><td class="num mono">' + money(sum(perTruck, (x) => x.o) + generalExp) + "</td>" +
        '<td class="num mono">' + money(sum(perTruck, (x) => x.profit) - generalExp) + '</td><td class="num"></td><td class="num"></td></tr></tfoot>' : "") +
      "</table></div></div></div>";

    /* ageing + top customers */
    const open = db.trips.filter((t) => t.status !== "cancelled" && tripBalance(t) > 0.5);
    const buckets = [["0–15 days", 0], ["16–30 days", 0], ["31–60 days", 0], ["60+ days", 0]];
    open.forEach((t) => {
      const credit = num((custById(t.customerId) || {}).creditDays) || num(db.settings.creditDays) || 30;
      const age = Math.max(0, -daysFromToday(t.endDate || t.startDate) - credit);
      const bal = tripBalance(t);
      if (age <= 15) buckets[0][1] += bal; else if (age <= 30) buckets[1][1] += bal; else if (age <= 60) buckets[2][1] += bal; else buckets[3][1] += bal;
    });
    const maxB = Math.max(1, Math.max.apply(null, buckets.map((b) => b[1])));
    html += '<div class="grid g-2">';
    html += '<div class="card"><div class="card-h"><h3>Receivables ageing</h3><span class="sub">' + open.length + ' open bills</span></div><div class="card-b">' +
      buckets.map((b, i) => '<div style="margin-bottom:11px"><div class="spread" style="margin-bottom:4px"><span class="sm" style="font-weight:550">' + b[0] +
        '</span><span class="mono sm" style="font-weight:650;color:' + (i >= 2 && b[1] > 0 ? "var(--red)" : "var(--text)") + '">' + money(b[1]) + "</span></div>" +
        '<div class="prog"><i style="width:' + Math.max(1.5, pct(b[1], maxB)).toFixed(1) + "%;background:" + (i >= 2 ? "var(--red)" : "var(--primary)") + '"></i></div></div>').join("") +
      '<div class="stat-line total-line"><span class="sl-l">Total receivable</span><span class="sl-v">' + money(outstandingTotal()) + "</span></div></div></div>";

    const byCust = db.customers.map((c) => {
      const ts = trips.filter((t) => t.customerId === c.id);
      return { c, rev: sum(ts, (t) => num(t.freight)), n: ts.length, due: custOutstanding(c.id) };
    }).filter((x) => x.n > 0).sort((a, b) => b.rev - a.rev).slice(0, 6);
    html += '<div class="card"><div class="card-h"><h3>Top customers</h3><span class="sub">' + esc(r.label) + '</span></div><div class="card-b tight">' +
      (byCust.length ? byCust.map((x) => '<div class="frow"><div class="t-avatar">' + esc(initials(x.c.name)) + "</div>" +
        '<div style="flex:1;min-width:0"><div class="t-main" style="font-size:12.8px">' + esc(x.c.name) + '</div><div class="t-sub">' + x.n + " trip" + (x.n === 1 ? "" : "s") + "</div></div>" +
        '<div style="text-align:right"><div class="mono" style="font-weight:650;font-size:12.8px">' + money(x.rev) + "</div>" +
        '<div class="t-sub">' + (x.due > 0.5 ? money(x.due) + " due" : "settled") + "</div></div></div>").join("")
        : '<div class="empty" style="padding:30px"><p>No delivered trips in this period.</p></div>') +
      "</div></div>";
    html += "</div>";
    return html;
  };

  function statLine(label, value, cls) {
    return '<div class="stat-line"><span class="sl-l">' + esc(label) + '</span><span class="sl-v ' + (cls || "") + '">' + value + "</span></div>";
  }

  /* ============================================================== exports */
  function csv(rows) {
    return rows.map((r) => r.map((c) => {
      const s = String(c == null ? "" : c);
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(",")).join("\r\n");
  }
  function download(name, text, mime) {
    try {
      const blob = new Blob(["\uFEFF" + text], { type: (mime || "text/csv") + ";charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast("Downloaded " + name, "green");
    } catch (e) { toast("Download blocked by the browser", "red"); }
  }
  const EXPORTS = {
    "export-trips": () => download("trips.csv", csv([["Trip", "Date", "Truck", "Driver", "Customer", "From", "To", "Material", "Weight", "Freight", "Received", "Balance", "Status"],
      ...db.trips.map((t) => [t.code, t.startDate, truckName(t.truckId), driverName(t.driverId), custName(t.customerId), t.from, t.to, t.material, t.weight, num(t.freight), tripReceived(t.id), tripBalance(t), t.status])])),
    "export-trucks": () => download("trucks.csv", csv([["Reg no", "Model", "Type", "Capacity", "Driver", "Status", "Odometer", "Insurance", "Fitness", "Permit", "Freight earned", "Running cost", "Profit"],
      ...db.trucks.map((t) => { const s = truckStats(t.id); return [t.regNo, t.model, t.type, t.capacity, driverName(t.driverId), truckState(t).label, t.odometer, t.insuranceExpiry, t.fitnessExpiry, t.permitExpiry, s.rev, s.cost, s.profit]; })])),
    "export-diesel": () => download("diesel.csv", csv([["Date", "Truck", "Litres", "Rate", "Amount", "Odometer", "Station", "Mode"],
      ...db.diesel.map((d) => [d.date, truckName(d.truckId), d.litres, d.rate, d.amount, d.odometer, d.station, d.mode])])),
    "export-maint": () => download("maintenance.csv", csv([["Date", "Truck", "Category", "Description", "Cost", "Odometer", "Vendor", "Next due"],
      ...db.maint.map((m) => [m.date, truckName(m.truckId), m.category, m.description, m.cost, m.odometer, m.vendor, m.nextDueDate])])),
    "export-payments": () => download("payments.csv", csv([["Date", "Customer", "Trip", "Amount", "Mode", "Reference", "Notes"],
      ...db.payments.map((p) => [p.date, custName(p.customerId), (tripById(p.tripId) || {}).code || "On account", p.amount, p.mode, p.ref, p.notes])])),
    "export-pl": () => {
      const r = rangeFor(ui.period || "month");
      const rows = [["Truck", "Trips", "Km", "Freight", "Diesel", "Maintenance", "Other", "Profit", "Margin %"]];
      db.trucks.forEach((t) => {
        const ts = db.trips.filter((x) => x.truckId === t.id && x.status === "delivered" && inRange(x.endDate || x.startDate, r));
        const rev = sum(ts, (x) => num(x.freight));
        const f = sum(db.diesel.filter((d) => d.truckId === t.id && inRange(d.date, r)), (d) => num(d.amount));
        const s = sum(db.maint.filter((m) => m.truckId === t.id && inRange(m.date, r)), (m) => num(m.cost));
        const o = sum(db.expenses.filter((e) => e.truckId === t.id && inRange(e.date, r)), (e) => num(e.amount));
        rows.push([t.regNo, ts.length, sum(ts, (x) => num(x.distance)), rev, f, s, o, rev - f - s - o, rev ? (((rev - f - s - o) / rev) * 100).toFixed(1) : ""]);
      });
      download("profit-and-loss.csv", csv(rows));
    },
  };

  /* deterministic pseudo-random so the sample fleet always looks the same */
  function seedRandom(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ───────────────────────────── markdown-lite ──────────────────────────── */
  function mdLite(src) {
    var s = esc(String(src || ""));
    s = s.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function (m, c) { return '<pre class="md-pre">' + c.replace(/\n$/, "") + "</pre>"; });
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>");
    s = s.replace(/^\s*#{1,4}\s*(.+)$/gm, '<div class="md-h">$1</div>');
    var lines = s.split("\n"), out = [], ul = false, ol = false;
    lines.forEach(function (ln) {
      var b = /^\s*[-*•]\s+(.*)$/.exec(ln), n = /^\s*\d+[.)]\s+(.*)$/.exec(ln);
      if (b) { if (ol) { out.push("</ol>"); ol = false; } if (!ul) { out.push("<ul>"); ul = true; } out.push("<li>" + b[1] + "</li>"); return; }
      if (n) { if (ul) { out.push("</ul>"); ul = false; } if (!ol) { out.push("<ol>"); ol = true; } out.push("<li>" + n[1] + "</li>"); return; }
      if (ul) { out.push("</ul>"); ul = false; }
      if (ol) { out.push("</ol>"); ol = false; }
      if (!ln.trim()) return;
      if (/^<\/?(pre|div|ul|ol)/.test(ln)) { out.push(ln); return; }
      out.push("<p>" + ln + "</p>");
    });
    if (ul) out.push("</ul>");
    if (ol) out.push("</ol>");
    return '<div class="md">' + out.join("") + "</div>";
  }

        customers: db.customers.map(function (c) { return c.name; }),
      };
      var out = await aiAsk([
        { role: "system", content: "You convert a truck operator's note into one JSON object. Reply with ONLY JSON, no prose, no code fences. Use the exact shape requested. Dates must be YYYY-MM-DD; if no date is stated use today. Pick the single best type. Numbers must be plain numbers (no currency symbols, no units). If a field is unknown use null." },
        { role: "user", content: "Known trucks: " + JSON.stringify(know.trucks) + "\nKnown customers: " + JSON.stringify(know.customers) + "\nToday: " + know.today + "\nShape: " + ENTRY_SHAPE + "\nNote: " + text },
      ], { temperature: 0 });
      var obj = aiJsonParse(out);
      if (!obj) { toast("Could not read that note — try phrasing it simply", "red"); if (box) box.innerHTML = ""; AI.busy = ""; return; }
      AI.busy = "";
      applySmartEntry(obj, text);
    } catch (e) {
      AI.busy = "";
      toast(aiErrMsg(e), "red");
      if (box) box.innerHTML = "";
    }
  }

  function applySmartEntry(o, raw) {
    var type = String(o.type || "unknown").toLowerCase();
    var toastMsg = o.summary || "Entry understood";
    if (type === "diesel" && o.diesel) {
      var d = o.diesel;
      dieselForm(null, {
        date: d.date || todayISO(), truckId: matchTruckId(d.truckReg), litres: d.litres, rate: d.rate,
        amount: d.amount, odometer: d.odometer, station: d.station, notes: d.notes || raw,
      });
      toast("Diesel entry filled in — check and save", "green");
      return;
    }
    if (type === "maint" && o.maint) {
      var m = o.maint;
      maintForm(null, {
        date: m.date || todayISO(), truckId: matchTruckId(m.truckReg), category: m.category,
        description: m.description || raw, cost: m.cost, vendor: m.vendor,
      });
      toast("Service job filled in — check and save", "green");
      return;
    }
    if (type === "expense" && o.expense) {
      var x = o.expense;
      expenseForm(null, {
        date: x.date || todayISO(), category: x.category, amount: x.amount,
        truckId: matchTruckId(x.truckReg), notes: x.notes || raw,
      });
      toast("Expense filled in — check and save", "green");
      return;
    }
    if (type === "payment" && o.payment) {
      var p = o.payment;
      paymentForm(null, {
        date: p.date || todayISO(), customerId: matchCustomerId(p.customerName),
        amount: p.amount, mode: p.mode, ref: p.reference || "", notes: raw,
      });
      toast("Payment filled in — check and save", "green");
      return;
    }
    if (type === "trip" && o.trip) {
      var t = o.trip;
      tripForm(null, {
        date: t.date, customerId: matchCustomerId(t.customerName), truckId: matchTruckId(t.truckReg),
        from: t.from, to: t.to, material: t.material, weight: t.weight, freight: t.freight,
        distance: t.distance, notes: raw,
      });

    openModal({
      title: "Not sure how to file this", size: "slim",

        '<pre class="md-pre" style="max-height:220px">' + esc(JSON.stringify(o, null, 2)) + "</pre>",
      submitLabel: "Close", onSubmit: function () { return true; },
    });
    toast(toastMsg, "blue");
  }

  async function aiReadImage(file) {
    if (!file) return;
    if (AI.state !== "ready") { toast("Sign in to Puter first", "blue"); return; }
    var P = aiLib();
    if (!P || !P.ai || !P.ai.img2txt) { toast("Image reading is not available in this Puter build", "red"); return; }
    AI.busy = "ocr";
    var box = $("#ai-entry-out");
    if (box) box.innerHTML = '<div class="ai-rec"><i></i> Reading the bill…</div>';
    try {
      var dataUrl = await new Promise(function (res, rej) {
        var r = new FileReader();
        r.onload = function () { res(r.result); };
        r.onerror = function () { rej(new Error("Could not read that file")); };
        r.readAsDataURL(file);
      });
      var txt = await P.ai.img2txt(dataUrl);
      var text = typeof txt === "string" ? txt : aiText(txt);
      AI.smartText = text || "";
      AI.busy = "";
      render();
      var ta = $("#ai-entry-text");
      if (ta && text) ta.value = text.slice(0, 900);
      if (text) { toast("Bill read — extracting details…", "green"); aiParseEntry(text); }
      else toast("No text found in that image", "red");
    } catch (e) {
      AI.busy = "";
      toast(aiErrMsg(e), "red");
      render();
    }
  }

  async function aiVoice() {
    if (AI.state !== "ready") { toast("Sign in to Puter first", "blue"); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
      toast("Recording is not supported in this browser", "red"); return;
    }
    var P = aiLib();
    if (!P || !P.ai || !P.ai.speech2txt) { toast("Voice notes are not available in this Puter build", "red"); return; }
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      var rec = new MediaRecorder(stream);
      var chunks = [];
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      AI.voiceOn = true;
      if (view === "ai") render();
      toast("Listening… speak now", "blue");
      rec.onstop = async function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        AI.voiceOn = false;
        if (view === "ai") render();
        var blob = new Blob(chunks, { type: "audio/webm" });
        if (!blob.size) { toast("Nothing recorded", "red"); return; }
        AI.busy = "stt";
        if (view === "ai") render();
        try {
          var res = await P.ai.speech2txt({ file: blob, provider: "openai", language: "en" });
          var text = (res && res.text) || (typeof res === "string" ? res : "");
          AI.busy = "";
          if (!text) { toast("Could not hear that clearly", "red"); if (view === "ai") render(); return; }
          AI.smartText = text;
          if (view === "ai") render();
          var ta = $("#ai-entry-text");
          if (ta) ta.value = text;
          aiParseEntry(text);
        } catch (e) {
          AI.busy = "";
          toast(aiErrMsg(e), "red");
          if (view === "ai") render();
        }
      };
      rec.start();
      setTimeout(function () { if (rec.state === "recording") rec.stop(); }, 12000);
    } catch (e) {
      AI.voiceOn = false;
      toast("Microphone permission denied", "red");
      if (view === "ai") render();
    }
  }

    "ai-copy-err": () => {
      var txt = "TruckOps AI connection error\n" + (AI.lastError || "unknown") + "\nURL: " + location.href + "\nProtocol: " + location.protocol + "\nEmbedded: " + aiEmbedded();
      try { navigator.clipboard.writeText(txt); toast("Diagnostics copied", "green"); } catch (e) { toast("Copy failed", "red"); }
    },
    "ai-send": () => aiSend($("#ai-input") ? $("#ai-input").value : ""),
    "ai-stop": () => aiStop(),
    "ai-clear": () => aiClearChat(),
    "ai-insights": () => aiGenerateInsights(true),
    "ai-parse": () => aiParseEntry($("#ai-entry-text") ? $("#ai-entry-text").value : ""),
    "ai-photo": () => { const ta = $("#ai-entry-text"); if (ta) AI.smartText = ta.value; const f = $("#ai-file"); if (f) f.click(); },
    "ai-voice": () => { const ta = $("#ai-entry-text"); if (ta) AI.smartText = ta.value; aiVoice(); },
    "ai-reminder": () => { const s = $("#ai-rem-cust"); aiReminder(s ? s.value : ""); },
    "ai-review-truck": (el) => {
      const s = $("#ai-rev-truck"), id = (el && el.dataset && el.dataset.id) || (s ? s.value : "");
      const t = truckById(id);
      if (!t) return;
      const st = truckStats(id), eff = fuelEfficiency(id);
      const fuel = db.diesel.filter((x) => x.truckId === id);
      const serv = db.maint.filter((x) => x.truckId === id);
      aiAnalyzeModal(
        "AI review · " + t.regNo, (t.model || "Truck") + " · " + truckState(t).label,
        "Review this single truck for its owner. Cover, in order and briefly: profitability (freight Rs " + Math.round(st.rev) + ", running cost Rs " + Math.round(st.cost) + ", net Rs " + Math.round(st.profit) + " over " + st.trips + " trips), fuel efficiency (" + (eff ? eff.toFixed(2) + " km/l" : "no odometer data") + ", " + fuel.length + " fill-ups) versus the rest of the fleet, maintenance spend (Rs " + Math.round(sum(serv, (x) => num(x.cost))) + " across " + serv.length + " jobs) and what that pattern suggests, plus any compliance or document risk. Finish with 3 concrete actions ranked by rupee impact. Max 160 words, markdown bullets.",
        "Truck " + t.regNo
      );
    },
    "ai-report": () => {
      const period = ui.period || "month", r = rangeFor(period);
      const trips = db.trips.filter((t) => t.status === "delivered" && inRange(t.endDate || t.startDate, r));
      aiAnalyzeModal(
        "AI analysis · " + r.label, "Profit, cost drivers and what to change",
        "Analyse the " + r.label + " period (" + r.from + " to " + r.to + "): " + trips.length + " delivered trips, freight billed Rs " + Math.round(sum(trips, (t) => num(t.freight))) + ". Explain what is driving cost, which truck or customer is the outlier, how collection compares with billing, and name the 3 highest-value moves for next month. Use the monthly series in the data for trend. Max 170 words, markdown bullets, every claim backed by a number.",
        "Period " + r.label
      );
    },
    "ai-copy": (el) => {
      const t = document.getElementById(el.dataset.target || "ai-rem-text");
      if (!t) return;
      const txt = t.value;
      const done = () => toast("Copied — paste it into WhatsApp or email", "green");
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(() => { t.select(); document.execCommand("copy"); done(); });
      else { t.select(); document.execCommand("copy"); done(); }
    },
    "ai-wa": (el) => {
      const t = document.getElementById(el.dataset.target || "ai-rem-text");
      if (!t) return;
      const url = "https://wa.me/?text=" + encodeURIComponent(t.value);
      window.open(url, "_blank", "noopener");
    },
    "ai-chat-open": () => go("ai"),
    /* ---- CRM ---- */
    "add-activity": () => activityForm(null),
    "log-cust": (el) => activityForm(el.dataset.id),
    "fu-log": (el) => { const a = activityById(el.dataset.id); if (a) activityForm(a.customerId, null, a.id); },
    "fu-edit": (el) => { const a = activityById(el.dataset.id); if (a) activityForm(a.customerId, a.id); },
    "fu-done": (el) => fuQuickDone(el.dataset.id),
    "fu-del": (el) => deleteActivity(el.dataset.id),
    "fu-tab": (el) => { ui.tab.followups = el.dataset.tab; render(); },
    "fu-tab-jump": () => { ui.tab.followups = "due"; go("followups"); },
    "fu-chip": (el) => {
      const f = document.querySelector('#modal-form [name="nextDate"]');
      if (f) { f.value = addDays(todayISO(), Number(el.dataset.days) || 1); f.dispatchEvent(new Event("input", { bubbles: true })); }
    },
    "stmt-ageing": () => printAgeing(),
    "stmt-cust": (el) => customerStatement(el.dataset.id),
    "trip-invoice": (el) => tripInvoice(el.dataset.id),
    "print-ageing": () => printAgeing(),
    "doc-print": () => doPrint(),
    "copy-url": () => {
      try { navigator.clipboard.writeText(location.href); toast("App link copied", "green"); }
      catch (e) { toast(location.href, "blue"); }
    },
    "print-profile": () => printDoc("Company profile", "Settings snapshot", profileInner()),
    "filter-customers": () => {},
    "ai-ask": (el) => aiSend(el.dataset.q || ""),
    "open-sidebar": () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("show"); },
    "close-sidebar": () => { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); },
    "modal-close": () => closeModal(),
    theme: () => {
      db.settings.theme = db.settings.theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", db.settings.theme);
      saveDB(); render();
    },
    "new-trip": () => tripForm(null),
    "add-truck": () => truckForm(null),
    "edit-truck": (el) => truckForm(el.dataset.id),
    "view-truck": (el) => truckDetail(el.dataset.id),
    "del-truck": (el) => deleteTruck(el.dataset.id),
    "add-driver": () => driverForm(null),
    "edit-driver": (el) => driverForm(el.dataset.id),
    "del-driver": (el) => deleteDriver(el.dataset.id),
    "add-customer": () => customerForm(null),
    "edit-customer": (el) => customerForm(el.dataset.id),
    "view-customer": (el) => customerDetail(el.dataset.id),
    "ai-remind-cust": (el) => aiReminder(el.dataset.id),
    "del-customer": (el) => deleteCustomer(el.dataset.id),
    "edit-trip": (el) => tripForm(el.dataset.id),
    "view-trip": (el) => tripDetail(el.dataset.id),
    "del-trip": (el) => deleteTrip(el.dataset.id),
    "cancel-trip": (el) => cancelTrip(el.dataset.id),
    dispatch: (el) => {
      const t = tripById(el.dataset.id);
      t.status = "in_transit";
      if (!t.startDate) t.startDate = todayISO();
      if (truckById(t.truckId)) { /* truck stays occupied */ }
      saveDB(); closeModal(); render();
      toast("Trip " + t.code + " dispatched on " + truckName(t.truckId), "green");
    },
    deliver: (el) => deliverTrip(el.dataset.id),
    "pay-trip": (el) => paymentForm(null, { tripId: el.dataset.id }),
    "add-diesel": () => dieselForm(null),
    "edit-diesel": (el) => dieselForm(el.dataset.id),
    "del-diesel": (el) => confirmModal("Delete entry?", "Remove this diesel entry?", () => { db.diesel = db.diesel.filter((x) => x.id !== el.dataset.id); saveDB(); render(); toast("Diesel entry deleted", "green"); }),
    "add-maint": () => maintForm(null),
    "edit-maint": (el) => maintForm(el.dataset.id),
    "del-maint": (el) => confirmModal("Delete job?", "Remove this maintenance record?", () => { db.maint = db.maint.filter((x) => x.id !== el.dataset.id); saveDB(); render(); toast("Maintenance deleted", "green"); }),
    "add-expense": () => expenseForm(null),
    "edit-expense": (el) => expenseForm(el.dataset.id),
    "del-expense": (el) => confirmModal("Delete expense?", "Remove this expense entry?", () => { db.expenses = db.expenses.filter((x) => x.id !== el.dataset.id); saveDB(); render(); toast("Expense deleted", "green"); }),
    "add-payment": () => paymentForm(null),
    "edit-payment": (el) => paymentForm(el.dataset.id),
    "del-payment": (el) => confirmModal("Delete payment?", "Remove this payment record?", () => { db.payments = db.payments.filter((x) => x.id !== el.dataset.id); saveDB(); render(); toast("Payment deleted", "green"); }),
    period: (el) => { ui.period = el.dataset.p; if (el.dataset.p === "custom" && !ui.range) ui.range = { from: addDays(todayISO(), -30), to: todayISO() }; render(); },
    print: () => window.print(),
    "save-settings": () => {
      const g = (id) => { const el = $("#" + id); return el ? String(el.value).trim() : ""; };
      db.settings.company = g("set-company") || "My Transport Co.";
      db.settings.currency = g("set-currency") || "₹";
      db.settings.creditDays = num(g("set-credit")) || 30;
      db.settings.phone = g("set-phone");
      db.settings.email = g("set-email");
      db.settings.gstin = g("set-gstin").toUpperCase();
      db.settings.state = g("set-state");
      db.settings.city = g("set-city");
      db.settings.address = g("set-address");
      db.settings.bank = g("set-bank");
      db.settings.invoicePrefix = g("set-prefix") || "INV";
      db.settings.gstRate = num(g("set-gst"));
      saveDB(); render(); toast("Settings saved", "green");
    },
    "export-json": () => download("truckops-backup-" + todayISO() + ".json", JSON.stringify(db, null, 2), "application/json"),
    "import-json": () => {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json,application/json";
      inp.onchange = () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const p = JSON.parse(rd.result);
            if (!p || typeof p !== "object" || !Array.isArray(p.trucks)) throw new Error("bad file");
            const next = emptyDB();
            Object.keys(next).forEach((k) => {
              if (k === "settings") Object.assign(next.settings, p.settings || {});
              else if (Array.isArray(p[k])) next[k] = p[k];
            });
            db = next; saveNow();
            document.documentElement.setAttribute("data-theme", db.settings.theme || "light");
            render(); toast("Backup restored", "green");
          } catch (err) { toast("That file is not a TruckOps backup", "red"); }
        };
        rd.readAsText(f);
      };
      inp.click();
    },
    demo: () => confirmModal("Load sample data?", "This replaces everything currently in the app with a demo fleet, drivers, trips, diesel, service and payment records.", () => seedDemo(), "Load sample"),
    wipe: () => confirmModal("Erase all data?", "Every truck, trip, fuel entry, payment and setting will be permanently deleted from this browser.", () => {
      try { localStorage.removeItem(KEY); } catch (e) {}
      db = emptyDB(); saveNow();
      document.documentElement.setAttribute("data-theme", "light");
      render(); toast("All data erased", "green");
    }, "Erase everything"),
  };

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "search") return;
    const fn = ACTIONS[act] || EXPORTS[act];
    if (!fn) return;
    /* never block native form submission or input behaviour */
    if (el.tagName === "A") e.preventDefault();
    fn(el, e);
  });
  document.addEventListener("input", (e) => {
    const el = e.target.closest('[data-act="search"]');
    if (!el) return;
    ui.q[el.dataset.view] = el.value;
    render();
    const s = $(".search input");
    if (s) { s.focus(); const v = s.value; s.value = ""; s.value = v; }
  });
  document.addEventListener("change", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "filter-trucks") { ui.status.trucks = el.value; render(); }
    else if (act === "filter-trips") { ui.status.trips = el.value; render(); }
    else if (act === "range-from") { ui.range = Object.assign({ from: addDays(todayISO(), -30), to: todayISO() }, ui.range, { from: el.value }); render(); }
    else if (act === "range-to") { ui.range = Object.assign({ from: addDays(todayISO(), -30), to: todayISO() }, ui.range, { to: el.value }); render(); }
    else if (act === "ai-model") { aiSetModel(el.value); }
    else if (act === "filter-customers") { ui.status.customers = el.value; render(); }
  });
  document.addEventListener("change", (e) => {
    const f = e.target.closest('[data-act="ai-file"]');
    if (f && f.files && f.files[0]) { aiReadImage(f.files[0]); f.value = ""; }
  });
  document.addEventListener("keydown", (e) => {
    if (e.target && e.target.id === "ai-input" && e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      aiSend(e.target.value);
      return;
    }
    if (e.target && e.target.id === "ai-entry-text" && (e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      aiParseEntry(e.target.value);
      return;
    }
    if (e.key === "Escape" && $("#modal-root").innerHTML) { closeModal(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      const s = $('.search input');
      if (s) { e.preventDefault(); s.focus(); s.select(); }
    }
  });
  window.addEventListener("hashchange", () => {
    const h = (location.hash || "").replace("#", "");
    if (TITLES[h] && h !== view) { view = h; render(); }
  });

  /* ----------------------------------------------------------------- init */
  function boot() {
    storageOK = checkStorage();
    loadDB();
    document.documentElement.setAttribute("data-theme", db.settings.theme === "dark" ? "dark" : "light");
    const h = (location.hash || "").replace("#", "");
    view = TITLES[h] ? h : "dashboard";
    /* inline favicon so the single file is self-contained */
    try {
      const fav = document.createElement("link");
      fav.rel = "icon";
      fav.href = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD074"/><stop offset=".5" stop-color="#F5A623"/><stop offset="1" stop-color="#E0930F"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><g fill="none" stroke="#121212" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22h22v20H12z"/><path d="M34 28h9l7 7v7H34z"/><circle cx="22" cy="45" r="4"/><circle cx="43" cy="45" r="4"/></g></svg>');
      document.head.appendChild(fav);
    } catch (e) {}
    aiRestoreChat();
    render();
    /* Puter.js is optional — loaded after first paint so it can never delay the app */
    setTimeout(loadPuter, 350);
    /* come back from the Puter window and the session is picked up automatically */
    function aiResume() {
      if (!AI.signingIn && AI.state !== "ready" && aiLib()) aiProbe();
    }
    window.addEventListener("focus", aiResume);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) aiResume(); });
    if (!storageOK) setTimeout(() => toast("Preview mode: changes won't be saved. Download the file and open it in your browser to keep your data.", "blue", "info"), 900);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
