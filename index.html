<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TruckOps — Truck Operations Management</title>
<style>
/* ============================================================
   TruckOps — design tokens
   ============================================================ */
:root{
  /* ── surfaces: Chalk Ivory White ───────────────────────────── */
  --bg:#FAFAFA;
  --panel:#FFFFFF;
  --panel-2:#F8F6F1;
  --panel-3:#EFECE4;
  --border:#E7E2D7;
  --border-strong:#D6CFC0;
  /* ── ink: Kajal Jet Black ──────────────────────────────────── */
  --text:#121212;
  --text-2:#33302B;
  --muted:#5E5A50;
  --faint:#6F6A5E;
  /* ── palette ───────────────────────────────────────────────── */
  --gold:#F5A623;            /* Imperial Highway Gold   */
  --gold-600:#E0930F;
  --gold-deep:#C67C00;       /* gold that meets 3:1 on white (data-viz) */
  --gold-ink:#7A4E00;        /* gold text that meets 4.5:1 on white     */
  --gold-soft:#FFF4DF;
  --saffron:#FF6D00;         /* Kesari Saffron          */
  --saffron-deep:#D95A00;
  --vermillion:#D0021B;      /* Royal Vermillion        */
  --sapphire:#0047AB;        /* Peacock Sapphire        */
  --sapphire-600:#003A8C;
  --emerald:#009E60;         /* Emerald Parrot          */
  --magenta:#D81B60;         /* Rani Magenta            */
  --magenta-ink:#B0124C;
  --turquoise:#00ACC1;       /* Jaipuri Turquoise       */
  --turquoise-deep:#00798A;
  --plum:#6A1B9A;            /* Lotus Plum              */
  /* ── semantic roles ────────────────────────────────────────── */
  --primary:#0047AB;
  --primary-600:#003A8C;
  --primary-soft:#E9F0FC;
  --primary-ring:rgba(0,71,171,.22);
  --on-primary:#FFFFFF;
  --green:#00713F;           /* accessible emerald ink  */
  --green-soft:#E3F6EC;
  --amber:#9C4300;           /* accessible saffron ink  */
  --amber-soft:#FFF0E1;
  --red:#D0021B;
  --red-soft:#FCE7E9;
  --blue:#0047AB;
  --blue-soft:#E9F0FC;
  --purple:#6A1B9A;
  --purple-soft:#F4E9FA;
  --teal:#006C79;
  --teal-soft:#DFF5F8;
  --magenta-soft:#FCE6EE;
  --gold-rule:rgba(245,166,35,.55);
  /* ── chrome ────────────────────────────────────────────────── */
  --sidebar-bg:linear-gradient(180deg,#121212 0%,#1C1810 100%);
  --sidebar-text:#C9C3B6;
  --radius:14px;
  --radius-sm:10px;
  --shadow-1:0 1px 2px rgba(18,18,18,.06);
  --shadow-2:0 1px 2px rgba(18,18,18,.05), 0 10px 24px -16px rgba(18,18,18,.38);
  --shadow-3:0 24px 60px -20px rgba(18,18,18,.40), 0 2px 8px rgba(18,18,18,.07);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  /* ── data-visualisation (all ≥3:1 on their panel) ───────────── */
  --viz-1:#0047AB;
  --viz-2:#009E60;
  --viz-3:#D95A00;
  --viz-gold:#C67C00;
  --viz-plum:#6A1B9A;
  --viz-turq:#00798A;
}
[data-theme="dark"]{
  --bg:#121212;              /* Kajal Jet Black */
  --panel:#1A1A1A;
  --panel-2:#161616;
  --panel-3:#232323;
  --border:#2E2E2E;
  --border-strong:#3F3F3F;
  --text:#FAFAFA;            /* Chalk Ivory White */
  --text-2:#DED9CF;
  --muted:#A9A396;
  --faint:#8F8878;
  --gold:#F5A623;
  --gold-600:#FFB84D;
  --gold-deep:#F5A623;
  --gold-ink:#F5A623;
  --gold-soft:#332608;
  --saffron:#FF8A33;
  --saffron-deep:#FF8A33;
  --vermillion:#FF5A6E;
  --sapphire:#66A3FF;
  --sapphire-600:#8FB8FF;
  --emerald:#22C97E;
  --magenta:#FF5C93;
  --magenta-ink:#FF5C93;
  --turquoise:#33D6E8;
  --turquoise-deep:#33D6E8;
  --plum:#C77DFF;
  --primary:#F5A623;
  --primary-600:#FFB84D;
  --primary-soft:#332608;
  --primary-ring:rgba(245,166,35,.30);
  --on-primary:#121212;
  --green:#22C97E;
  --green-soft:#0E2E20;
  --amber:#FF8A33;
  --amber-soft:#3A2107;
  --red:#FF5A6E;
  --red-soft:#3A0A10;
  --blue:#66A3FF;
  --blue-soft:#0E1F3D;
  --purple:#C77DFF;
  --purple-soft:#2A1040;
  --teal:#33D6E8;
  --teal-soft:#0A2E33;
  --magenta-soft:#3A0C1E;
  --gold-rule:rgba(245,166,35,.5);
  --sidebar-bg:linear-gradient(180deg,#0B0B0B 0%,#15120E 100%);
  --sidebar-text:#B9B3A6;
  --shadow-2:0 1px 2px rgba(0,0,0,.45), 0 12px 28px -18px rgba(0,0,0,.85);
  --shadow-3:0 28px 70px -20px rgba(0,0,0,.85), 0 2px 10px rgba(0,0,0,.4);
  --viz-1:#F5A623;
  --viz-2:#22C97E;
  --viz-3:#FF8A33;
  --viz-gold:#F5A623;
  --viz-plum:#B44BE8;
  --viz-turq:#33D6E8;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
::selection{background:var(--primary-ring)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:0 0 auto;display:block}
.ic.sm{width:15px;height:15px}
.ic.lg{width:22px;height:22px}

/* ---------- scrollbars ---------- */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   Shell
   ============================================================ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:238px;flex:0 0 238px;background:var(--sidebar-bg);color:var(--sidebar-text);
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;height:100vh;z-index:60;
  border-right:1px solid rgba(255,255,255,.06);
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#121212;
  background:linear-gradient(140deg,#FFD074 0%,#F5A623 45%,#E0930F 100%);
  box-shadow:0 8px 20px -8px rgba(245,166,35,.85), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(160,100,0,.35);
}
.brand-mark .ic{width:22px;height:22px}
.brand-txt{min-width:0;flex:1}
.brand-txt strong{display:block;color:#fff;font-size:15.5px;letter-spacing:.2px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:#A79F8E;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:6px 10px 10px}
.nav-lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#9A9384;padding:14px 10px 6px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;
  color:var(--sidebar-text);font-size:13.5px;font-weight:500;margin-bottom:2px;border:1px solid transparent;
  transition:background .15s,color .15s,transform .1s; user-select:none;
}
.nav-item:hover{background:rgba(245,166,35,.10);color:#FAFAFA}
.nav-item:active{transform:scale(.985)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(245,166,35,.22),rgba(245,166,35,.02));
  color:#FFFFFF;border-color:rgba(245,166,35,.34);
  box-shadow:inset 2.5px 0 0 0 var(--gold), 0 6px 18px -12px rgba(245,166,35,.9);
}
.nav-item.active .ic{color:#FFCE73}
.nav-item .ic{opacity:.85}
.nav-count{
  margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(250,250,250,.14);color:#FAFAFA;
  border-radius:20px;padding:1px 6px;min-width:19px;text-align:center;
}
.nav-item.active .nav-count{background:rgba(245,166,35,.30);color:#FFE7BC}
.nav-count.warn{background:rgba(208,2,27,.38);color:#FFD9DD}
.side-foot{padding:10px 14px 14px;border-top:1px solid rgba(245,166,35,.18)}
.side-foot .sf-line{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:#9A9384;padding:3px 2px}
.sf-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(0,158,96,.20);color:#7BE3B0;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;border:1px solid rgba(0,158,96,.28)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

.main{flex:1;min-width:0;margin-left:238px;display:flex;flex-direction:column;min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:13px 24px;border-bottom:1px solid var(--border);
  background:var(--bg);backdrop-filter:saturate(1.4) blur(10px);
}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none;
  background:linear-gradient(90deg,var(--gold) 0%,var(--saffron) 22%,var(--vermillion) 40%,transparent 78%);opacity:.55}
.page-h{min-width:0}
.page-h h1{font-size:18.5px;font-weight:660;letter-spacing:-.2px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-h p{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.date-chip{
  display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
  background:var(--panel);border:1px solid var(--border);padding:7px 11px;border-radius:9px;white-space:nowrap;
}
.view{padding:20px 24px 60px;max-width:1560px;width:100%;margin:0 auto;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hamburger{display:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(18,18,18,.58);z-index:55;backdrop-filter:blur(2px)}

@media (min-width:1180px){ .date-chip{display:inline-flex} }
@media (max-width:980px){
  .sidebar{transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
  .sidebar.open{transform:none;box-shadow:var(--shadow-3)}
  .main{margin-left:0}
  .hamburger{display:inline-flex}
  .scrim.show{display:block}
  .view{padding:16px 14px 70px}
  .topbar{padding:11px 14px}
  .page-h h1{font-size:16px}
  .page-h p{display:none}
}

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--panel);color:var(--text-2);
  padding:8px 13px;border-radius:9px;font-size:13px;font-weight:560;white-space:nowrap;
  transition:background .14s,border-color .14s,box-shadow .14s,transform .08s,color .14s;
  box-shadow:var(--shadow-1);
}
.btn:hover{background:var(--panel-3);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-ring)}
.btn.primary{
  background:linear-gradient(180deg,var(--primary),var(--primary-600));border-color:transparent;color:var(--on-primary);
  box-shadow:0 8px 18px -10px var(--primary),inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.10);
  font-weight:600;
}
.btn.primary:hover{filter:brightness(1.06);background:linear-gradient(180deg,var(--primary),var(--primary-600))}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-3);color:var(--text)}
.btn.outline{background:transparent;box-shadow:none}
.btn.danger{background:var(--red-soft);border-color:transparent;color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff}
.btn.ok{background:var(--green-soft);border-color:transparent;color:var(--green)}
.btn.ok:hover{background:var(--green);color:#fff}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px;gap:5px}
.btn.icon{padding:7px;border-radius:8px}
.btn.sm.icon{padding:5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-group{display:inline-flex;gap:6px}

/* ============================================================
   Cards / layout helpers
   ============================================================ */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-2)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:14px;font-weight:620;letter-spacing:-.1px}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-b{padding:16px}
.card-b.tight{padding:0}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-23{grid-template-columns:1.55fr 1fr}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g-32{grid-template-columns:1fr 1.55fr}
@media (max-width:1100px){ .g-2,.g-3,.g-23,.g-32{grid-template-columns:1fr} }
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:2px}
.mt{margin-top:16px}.mt-s{margin-top:10px}.mb{margin-bottom:16px}

/* KPI */
.kpi{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow-2);overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--kpi-c,var(--primary)) 0%,var(--kpi-c,var(--primary)) 62%,transparent 100%)}
.kpi-top{display:flex;align-items:center;gap:9px}
.kpi-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--kpi-soft,var(--primary-soft));color:var(--kpi-ink,var(--primary));border:1px solid var(--kpi-soft,var(--primary-soft))}
.kpi-ic .ic{width:16px;height:16px}
.kpi-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kpi-val{font-size:22px;font-weight:680;letter-spacing:-.5px;margin-top:7px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kpi-sub b{color:var(--text-2);font-weight:600}
.trend{display:inline-flex;align-items:center;gap:3px;font-weight:650;font-size:11px;padding:1px 5px;border-radius:5px}
.trend.up{color:var(--green);background:var(--green-soft)}
.trend.down{color:var(--red);background:var(--red-soft)}
.trend.flat{color:var(--muted);background:var(--panel-3)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:640;line-height:1.55;white-space:nowrap;border:1px solid transparent}
.b-green{background:var(--green-soft);color:var(--green)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-purple{background:var(--purple-soft);color:var(--purple)}
.b-teal{background:var(--teal-soft);color:var(--teal)}
.b-gray{background:var(--panel-3);color:var(--muted)}
.badge .dot{width:5px;height:5px}

/* Toolbar / search */
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center;flex:1 1 240px;max-width:340px;min-width:0}
.search .ic{position:absolute;left:10px;color:var(--faint);pointer-events:none}
.search input{
  width:100%;padding:8px 12px 8px 33px;border-radius:9px;border:1px solid var(--border-strong);background:var(--panel);
  min-width:0;font-size:13px;outline:none;transition:box-shadow .15s,border-color .15s;
}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
select.pick{
  padding:8px 30px 8px 11px;border-radius:9px;border:1px solid var(--border-strong);background:var(--panel);
  font-size:13px;cursor:pointer;outline:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238A8A8A' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;background-size:15px;
}
select.pick:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}

/* Chips (mini stats) */
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:7px 12px;box-shadow:var(--shadow-1);
}
.chip .c-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:640}
.chip .c-v{font-size:13.5px;font-weight:680;font-variant-numeric:tabular-nums}
.chip .ic{color:var(--faint)}

/* Tables */
.tbl-wrap{overflow:auto;border-radius:0 0 var(--radius) var(--radius)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.tbl th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.65px;color:var(--muted);
  font-weight:700;padding:9px 12px;background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border-bottom:1px solid var(--border-strong);
  box-shadow:inset 0 -2px 0 -1px var(--gold);position:sticky;top:0;z-index:2;white-space:nowrap;
}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:var(--panel-2)}
table.tbl td.r,table.tbl th.r{text-align:right}
table.tbl .act{display:flex;gap:4px;justify-content:flex-end}
.t-main{font-weight:600;color:var(--text)}
.t-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.t-avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(140deg,var(--primary-soft),var(--panel-3));color:var(--primary);font-weight:700;font-size:12px;flex:0 0 auto;border:1px solid var(--border)}
.cellflex{display:flex;align-items:center;gap:9px}
.neg{color:var(--red)}
.pos{color:var(--green)}

/* Empty state */
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.empty .e-ic{width:52px;height:52px;border-radius:16px;background:linear-gradient(140deg,var(--gold-soft),var(--primary-soft));color:var(--gold-ink);display:grid;place-items:center;margin:0 auto 12px;border:1px solid var(--border)}
.empty h4{font-size:14.5px;color:var(--text);font-weight:640;margin-bottom:4px}
.empty p{font-size:12.5px;max-width:340px;margin:0 auto 14px}

/* Alerts list */
.alist{display:flex;flex-direction:column}
.aitem{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);align-items:flex-start}
.aitem:last-child{border-bottom:0}
.aitem .a-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.aitem .a-ic .ic{width:14px;height:14px}
.aitem.red .a-ic{background:var(--red-soft);color:var(--red)}
.aitem.amber .a-ic{background:var(--amber-soft);color:var(--amber)}
.aitem.blue .a-ic{background:var(--blue-soft);color:var(--blue)}
.aitem .a-t{font-size:12.8px;font-weight:580;line-height:1.35}
.aitem .a-d{font-size:11.5px;color:var(--muted)}
.aitem .a-go{margin-left:auto;color:var(--faint);cursor:pointer;padding:2px;border-radius:6px}
.aitem .a-go:hover{color:var(--primary);background:var(--primary-soft)}

/* progress */
.prog{height:6px;border-radius:20px;background:var(--panel-3);overflow:hidden;min-width:60px}
.prog > i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--teal))}

/* fleet rows */
.frow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--border)}
.frow:last-child{border-bottom:0}
.frow:hover{background:var(--panel-2)}
.freg{font-weight:640;font-size:12.8px;letter-spacing:.2px}
.fmeta{font-size:11.3px;color:var(--muted)}

/* activity */
.act-item{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);align-items:center}
.act-item:last-child{border-bottom:0}
.act-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.act-ic .ic{width:14px;height:14px}
.act-amt{margin-left:auto;font-weight:660;font-size:12.6px;font-variant-numeric:tabular-nums}

/* ============================================================
   Forms / modal
   ============================================================ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(18,18,18,.46);backdrop-filter:blur(3px);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;
  animation:fade .15s ease;
}
.modal{
  background:var(--panel);border-radius:16px;box-shadow:var(--shadow-3);width:100%;max-width:600px;
  margin:auto;border:1px solid var(--border);animation:pop .18s cubic-bezier(.2,.9,.3,1.2);
  position:relative;overflow:hidden;
}
.modal::before{content:"";display:block;height:3px;
  background:linear-gradient(90deg,var(--gold) 0%,var(--saffron) 42%,var(--vermillion) 68%,var(--magenta) 88%,var(--plum) 100%)}
.modal.wide{max-width:840px}
.modal.slim{max-width:430px}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:15.5px;font-weight:650;letter-spacing:-.2px}
.modal-h p{font-size:12px;color:var(--muted);margin-top:2px}
.modal-h .btn{margin-left:auto}
.modal-b{padding:18px;max-height:min(68vh,660px);overflow:auto}
.modal-f{display:flex;align-items:center;gap:8px;padding:13px 18px;border-top:1px solid var(--border);background:var(--panel-2);border-radius:0 0 16px 16px}
.modal-f .spacer{flex:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){ .form-grid{grid-template-columns:1fr} .kpi-val{font-size:20px} .search{max-width:none} }
@media (max-width:600px){ .card-h .sub{display:none} }
@media (max-width:420px){ .kpi-lbl{font-size:10px} .kpi{padding:12px} }
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field > span{font-size:11.5px;font-weight:640;color:var(--muted);letter-spacing:.2px}
.field > span .req{color:var(--red)}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border-strong);background:var(--panel);
  font-size:13.2px;outline:none;transition:border-color .15s,box-shadow .15s;appearance:none;
}
.field select{
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238A8A8A' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:15px;padding-right:30px;cursor:pointer;
}
.field textarea{resize:vertical;min-height:66px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.field input:disabled,.field select:disabled{background:var(--panel-3);color:var(--muted);cursor:not-allowed}
.field .hint{font-size:11px;color:var(--faint)}
.field.err input,.field.err select{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.14)}
.form-note{
  grid-column:1/-1;display:flex;gap:9px;align-items:flex-start;background:var(--blue-soft);color:var(--blue);
  border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.4;
}
.form-note.warn{background:var(--amber-soft);color:var(--amber)}
.form-note .ic{width:15px;height:15px;margin-top:1px}
.form-sec{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);font-weight:700;margin-top:4px;padding-bottom:2px;border-bottom:1px dashed var(--gold-rule)}

/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border);
  border-left:3px solid var(--primary);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow-3);
  font-size:13px;font-weight:550;max-width:340px;animation:slidein .2s cubic-bezier(.2,.9,.3,1.15);pointer-events:auto;
}
.toast .ic{width:16px;height:16px}
.toast.green{border-left-color:var(--green)} .toast.green .ic{color:var(--green)}
.toast.red{border-left-color:var(--red)} .toast.red .ic{color:var(--red)}
.toast.blue{border-left-color:var(--blue)} .toast.blue .ic{color:var(--blue)}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* charts */
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.chart-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.chart-svg text{font-family:inherit;font-size:10.5px;fill:var(--muted)}
.chart-svg .axis{stroke:var(--border);stroke-width:1}
.chart-svg .bar{transition:opacity .15s}
.chart-svg .bar:hover{opacity:.78}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.donut-legend{display:flex;flex-direction:column;gap:7px;font-size:12.2px;min-width:130px}
.donut-legend .dl{display:flex;align-items:center;gap:7px}
.donut-legend .dl b{margin-left:auto;font-variant-numeric:tabular-nums}

/* reports table */
.rep-tbl td.num,.rep-tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;background:var(--panel-3);padding:3px;border-radius:9px}
.tab{padding:5px 11px;border-radius:7px;font-size:12.3px;font-weight:600;color:var(--muted);cursor:pointer;border:0;background:transparent}
.tab.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-1)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.8px}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;font-weight:560;text-align:right;font-variant-numeric:tabular-nums}

.stat-line{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.stat-line:last-child{border-bottom:0}
.stat-line .sl-l{color:var(--muted);font-size:12.5px}
.stat-line .sl-v{font-weight:650;font-variant-numeric:tabular-nums}
.total-line{border-top:2px solid var(--border-strong);border-bottom:0;margin-top:4px;padding-top:10px;font-size:14px}
.total-line .sl-v{font-size:16px}

/* ============================================================
   AI copilot
   ============================================================ */
.ai-hero{
  position:relative;overflow:hidden;border-radius:var(--radius);padding:16px 18px;
  background:linear-gradient(120deg,var(--gold-soft) 0%,var(--panel) 46%,var(--panel) 100%);
  border:1px solid var(--border);box-shadow:var(--shadow-2);
}
.ai-hero::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;
  background:linear-gradient(180deg,var(--gold),var(--magenta) 55%,var(--sapphire))}
.ai-mark{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:0 0 auto;
  background:linear-gradient(140deg,var(--gold),var(--magenta) 58%,var(--sapphire));
  box-shadow:0 8px 20px -10px var(--magenta),inset 0 1px 0 rgba(255,255,255,.35);
}
[data-theme="dark"] .ai-mark{color:#121212}
.ai-mark .ic{width:20px;height:20px}
.ai-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold-rule)}
.ai-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--faint);flex:0 0 auto}
.ai-dot.on{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.ai-dot.wait{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.ai-dot.off{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.ai-chat{display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 212px)}
.ai-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:168px;scroll-behavior:smooth}
.ai-msg{display:flex;gap:9px;align-items:flex-start;animation:fade .16s ease}
.ai-msg .av{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;font-size:11px;font-weight:700}
.ai-msg.user{flex-direction:row-reverse}
.ai-msg.user .av{background:var(--primary-soft);color:var(--primary)}
.ai-msg.bot .av{background:linear-gradient(140deg,var(--gold),var(--magenta) 60%,var(--sapphire));color:#fff}
[data-theme="dark"] .ai-msg.bot .av{color:#121212}
.ai-bubble{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13.3px;line-height:1.55;border:1px solid var(--border);background:var(--panel-2);color:var(--text)}
.ai-msg.user .ai-bubble{background:var(--primary-soft);border-color:transparent;color:var(--text)}
.ai-msg.err .ai-bubble{background:var(--red-soft);border-color:transparent;color:var(--red)}
.ai-sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ai-sugg button{cursor:pointer;font-size:12px;padding:5px 10px;border-radius:20px;border:1px dashed var(--border-strong);
  background:var(--panel);color:var(--muted);transition:all .14s}
.ai-sugg button:hover{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.ai-compose{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:var(--panel-2);border-radius:0 0 var(--radius) var(--radius)}
.ai-compose textarea{flex:1;resize:none;min-height:38px;max-height:120px;padding:9px 11px;border-radius:10px;
  border:1px solid var(--border-strong);background:var(--panel);font-size:13.2px;outline:none;line-height:1.45}
.ai-compose textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-rule)}
.ai-typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin-right:3px;animation:aiblink 1.1s infinite}
.ai-typing i:nth-child(2){animation-delay:.16s}
.ai-typing i:nth-child(3){animation-delay:.32s}
@keyframes aiblink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.md{font-size:13.3px;line-height:1.6;color:var(--text-2)}
.md p{margin:0 0 7px}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 7px;padding-left:19px}
.md li{margin-bottom:3px}
.md strong{color:var(--text);font-weight:660}
.md em{color:var(--muted)}
.md code{font-family:var(--mono);font-size:12px;background:var(--panel-3);padding:1px 5px;border-radius:5px}
.md .md-h{font-weight:680;color:var(--text);margin:8px 0 4px;font-size:13px}
.md .md-pre{font-family:var(--mono);font-size:11.6px;background:var(--panel-3);padding:9px 11px;border-radius:9px;overflow:auto;white-space:pre-wrap;margin:0 0 8px}
.ai-res{background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:12px 13px;min-height:44px}
.ai-rec{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--red)}
.ai-rec i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:aiblink 1.2s infinite}
.ai-cap{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px}
.ai-file{display:none}
.g-ai{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:1100px){ .g-ai{grid-template-columns:minmax(0,1fr)} }

.ai-errbox{display:flex;gap:9px;align-items:flex-start;background:var(--red-soft);border:1px solid var(--red);border-left-width:3px;
  border-radius:10px;padding:9px 11px;margin-bottom:12px;color:var(--red)}
.ai-errbox .ic{flex:0 0 auto;margin-top:1px}

/* ============================================================
   CRM: follow-ups, timeline, documents
   ============================================================ */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--gold),var(--gold-rule) 60%,transparent)}
.tl-item{position:relative;padding:0 0 13px 0}
.tl-item::before{content:"";position:absolute;left:-17px;top:4px;width:9px;height:9px;border-radius:50%;
  background:var(--panel);border:2px solid var(--gold)}
.tl-item.done::before{background:var(--green);border-color:var(--green)}
.tl-item.late::before{background:var(--vermillion);border-color:var(--vermillion)}
.tl-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tl-t{font-weight:620;font-size:12.8px;color:var(--text)}
.tl-d{font-size:11.5px;color:var(--muted)}
.tl-b{font-size:12.6px;color:var(--text-2);line-height:1.5;margin-top:2px}
.stage{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.3px;
  text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid transparent}
.stage.lead{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-rule)}
.stage.active{background:var(--green-soft);color:var(--green)}
.stage.dormant{background:var(--panel-3);color:var(--muted);border-color:var(--border)}
.stage.hold{background:var(--red-soft);color:var(--red)}
.fu-row{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--border)}
.fu-row:last-child{border-bottom:0}
.fu-row:hover{background:var(--panel-2)}
.fu-row .fu-main{flex:1;min-width:0}
.fu-row .fu-when{font-size:11.5px;font-weight:650;white-space:nowrap}
.fu-row .fu-when.today{color:var(--saffron-ink)}
.fu-row .fu-when.late{color:var(--red)}
.fu-row .fu-when.soon{color:var(--muted)}

/* printable document sheet */
.sheet{background:#fff;color:#121212;border-radius:12px;padding:26px 28px;border:1px solid var(--border);
  box-shadow:var(--shadow-2);max-width:820px;margin:0 auto}
.sheet h2{font-size:18px;letter-spacing:-.2px;margin:0}
.sheet .sh-head{display:flex;justify-content:space-between;gap:18px;border-bottom:2px solid #121212;padding-bottom:12px;margin-bottom:14px}
.sheet .sh-co{font-size:15px;font-weight:700}
.sheet .sh-meta{font-size:11.6px;line-height:1.6;color:#3A3A3A;text-align:right}
.sheet table{width:100%;border-collapse:collapse;font-size:12.4px}
.sheet th{text-align:left;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#5E5A50;
  border-bottom:1px solid #C9C3B4;padding:6px 8px}
.sheet td{padding:7px 8px;border-bottom:1px solid #EDEAE2;vertical-align:top}
.sheet tfoot td{border:0;padding:4px 8px}
.sheet .sh-tot{font-size:14.5px;font-weight:700}
.sheet .sh-words{font-size:11.8px;color:#3A3A3A;margin-top:10px}
.sheet .sh-sign{display:flex;justify-content:space-between;margin-top:34px;font-size:11.6px;color:#3A3A3A}
@media print{
  .sheet{border:0;box-shadow:none;padding:0;max-width:none}
}

/* print a document only */
@page{margin:12mm}
@media print{
  html.print-doc .sidebar,html.print-doc .topbar,html.print-doc .scrim,html.print-doc #toasts{display:none!important}
  html.print-doc .app{display:none!important}
  html.print-doc #modal-root{display:block!important;position:static!important;margin:0!important;padding:0!important}
  html.print-doc body{margin:0!important;padding:0!important;background:#fff!important}
  html.print-doc .view{display:none!important}
  html.print-doc .modal-backdrop{position:static!important;display:block!important;padding:0!important;background:none!important;backdrop-filter:none!important}
  html.print-doc .modal{position:static!important;width:100%!important;max-width:none!important;max-height:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;transform:none!important}
  html.print-doc .modal-h,html.print-doc .modal-f{display:none!important}
  html.print-doc .modal-b{padding:0!important;overflow:visible!important;max-height:none!important}
  html.print-doc .modal::before{display:none!important}
}

/* print */
@media print{
  [data-theme="dark"]{--bg:#fff;--panel:#fff;--panel-2:#fff;--panel-3:#F4F2EC;--text:#121212;--text-2:#33302B;
    --muted:#5E5A50;--faint:#8B8577;--border:#DDD8CC;--border-strong:#C9C3B4;--primary:#0047AB;--on-primary:#fff}
  .sidebar,.topbar,.toolbar,#toasts,.no-print{display:none!important}
  .main{margin-left:0}
  .view{padding:0;max-width:none}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}

}

<div class="app">

  <div class="main">

      <button class="btn icon ghost hamburger" data-act="open-sidebar" aria-label="Menu">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

<script>
/* ============================================================================
   TruckOps — single-file truck operations manager
   Modules: Dashboard · Trucks · Drivers · Customers · Trips(Orders) ·
            Diesel · Maintenance · Expenses · Payments · Reports · Settings
   Storage: localStorage (offline-first). No external dependencies.
   ============================================================================ */
(function () {
  "use strict";

  /* ---------------------------------------------------------------- utils */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v) => {
    const n = parseFloat(String(v == null ? "" : v).replace(/[,\s₹]/g, ""));
    return isFinite(n) ? n : 0;
  };
  const sum = (arr, fn) => arr.reduce((a, x) => a + (fn ? fn(x) : num(x)), 0);
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

  function todayISO() {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  }
  function monthKey(iso) { return (iso || "").slice(0, 7); }
  function thisMonth() { return todayISO().slice(0, 7); }
  function addDays(iso, n) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + n);
    return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  }
  function addMonthsKey(key, n) {

    db.trips.forEach((t) => {
      if (t.status === "cancelled") return;
      const bal = tripBalance(t);
      if (bal <= 0.5) return;
      const cd = custCreditDays(custById(t.customerId)) || def;
      const od = -daysFromToday(addDays(t.endDate || t.startDate, cd));
      const i = od <= 0 ? 0 : od <= 30 ? 1 : od <= 60 ? 2 : od <= 90 ? 3 : 4;
      b[i].v += bal; b[i].n++;
    });
    return b;
  }

  function fuelEfficiency(truckId) {
    const rows = db.diesel.filter((d) => d.truckId === truckId && num(d.odometer) > 0).sort((a, b) => num(a.odometer) - num(b.odometer));
    if (rows.length < 2) return null;
    let km = 0, ltr = 0;
    for (let i = 1; i < rows.length; i++) {
      const delta = num(rows[i].odometer) - num(rows[i - 1].odometer);
      if (delta > 0 && delta < 5000) { km += delta; ltr += num(rows[i].litres); }
    }
    return ltr > 0 ? km / ltr : null;
  }

  }

  /* ---------------------------------------------------------------- modal */
  let modalOpts = null;
  var PENDING_PRE = null;
  function applyPrefill(form) {
    var pre = PENDING_PRE;
    PENDING_PRE = null;
    if (!pre || !form) return;
    Object.keys(pre).forEach(function (k) {
      var v = pre[k];
      if (v === undefined || v === null || v === "") return;
      var el = form.querySelector('[name="' + k + '"]');
      if (!el) return;
      if (el.tagName === "SELECT") {
        var ok = Array.prototype.some.call(el.options, function (o) { return o.value === String(v); });
        if (!ok) return;
        el.value = String(v);
      } else el.value = v;
      try { el.dispatchEvent(new Event("input", { bubbles: true })); } catch (e) {}
      try { el.dispatchEvent(new Event("change", { bubbles: true })); } catch (e) {}
    });
    var first = form.querySelector(".field.err");
    if (first) first.classList.remove("err");
  }
  function openModal(o) {
    modalOpts = o;
    const root = $("#modal-root");
    root.innerHTML =
      '<div class="modal-backdrop" data-act="modal-bg"><form class="modal ' + (o.size || "") + '" id="modal-form" novalidate>' +
      '<div class="modal-h"><div><h3>' + esc(o.title) + '</h3>' + (o.subtitle ? '<p>' + esc(o.subtitle) + "</p>" : "") + "</div>" +
      '<button type="button" class="btn icon ghost" data-act="modal-close" aria-label="Close">' + I("x") + "</button></div>" +
      '<div class="modal-b">' + (o.body || "") + "</div>" +
      '<div class="modal-f"><div class="spacer"></div>' +
      '<button type="button" class="btn ghost" data-act="modal-close">Cancel</button>' +
      '<button type="submit" class="btn primary">' + esc(o.submitLabel || "Save") + "</button></div>" +
      "</form></div>";
    const back = root.querySelector(".modal-backdrop");
    if (back) back.addEventListener("mousedown", (e) => { if (e.target === back) closeModal(); });
    const form = $("#modal-form");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!modalOpts) return;
      const data = {};
      new FormData(form).forEach((v, k) => { data[k] = typeof v === "string" ? v.trim() : v; });
      const res = modalOpts.onSubmit ? modalOpts.onSubmit(data, form) : true;
      if (res === true) { closeModal(); }
      else if (typeof res === "string" && res) { toast(res, "red"); }
    });
    $$(".field input, .field select", form).forEach((inp) => {
      inp.addEventListener("input", () => inp.closest(".field") && inp.closest(".field").classList.remove("err"));
    });
    if (o.onMount) o.onMount(form);
    applyPrefill(form);
    setTimeout(() => { const f = form.querySelector("[autofocus], input:not([type=hidden]), select"); if (f) f.focus({ preventScroll: true }); }, 40);
  }

  /* ================================================================ charts */
  function chartBars(labels, series, opts) {
    opts = opts || {};
    const W = 720, H = opts.h || 240;
    const pad = { l: 52, r: 10, t: 14, b: 26 };
    const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
    const maxRaw = Math.max(1, ...series.map((s) => Math.max.apply(null, s.values)));
    const max = niceCeil(maxRaw);
    const gw = plotW / Math.max(1, labels.length);
    const bw = Math.min(20, (gw * 0.66) / series.length);
    let g = "";
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + (plotH * i) / 4;
      g += '<line class="axis" x1="' + pad.l + '" y1="' + y + '" x2="' + (W - pad.r) + '" y2="' + y + '" stroke-dasharray="' + (i === 4 ? "0" : "3 4") + '"/>';
      g += '<text x="' + (pad.l - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + compactShort(max - (max * i) / 4) + "</text>";
    }
    labels.forEach((lab, i) => {
      const x0 = pad.l + gw * i;
      const totalW = bw * series.length + 3 * (series.length - 1);
      const sx = x0 + (gw - totalW) / 2;
      series.forEach((s, si) => {
        const v = s.values[i] || 0;
        const h = max ? Math.max(v > 0 ? 2 : 0, (v / max) * plotH) : 0;
        const x = sx + si * (bw + 3);
        g += '<rect class="bar" x="' + x + '" y="' + (pad.t + plotH - h) + '" width="' + bw + '" height="' + h + '" rx="' + Math.min(3, bw / 2) + '" fill="' + s.color + '"><title>' + esc(lab + " · " + s.name + ": " + money(v)) + "</title></rect>";
      });
      g += '<text x="' + (x0 + gw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lab) + "</text>";
    });
    return '<svg class="chart-svg" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet">' + g + "</svg>" +
      '<div class="chart-legend">' + series.map((s) => '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + "</span>").join("") + "</div>";
  }
  function compactShort(v) {
    const a = Math.abs(v);
    if (a >= 1e7) return (v / 1e7).toFixed(1).replace(/\.0$/, "") + "Cr";
    if (a >= 1e5) return (v / 1e5).toFixed(1).replace(/\.0$/, "") + "L";
    if (a >= 1e3) return (v / 1e3).toFixed(0) + "k";
    return String(Math.round(v));
  }
  function arcPath(cx, cy, r, a0, a1) {
    const p = (a, r2) => [cx + r2 * Math.cos(a), cy + r2 * Math.sin(a)];
    const s = p(a0, r), e = p(a1, r);
    const large = a1 - a0 > Math.PI ? 1 : 0;
    return "M" + s[0].toFixed(2) + " " + s[1].toFixed(2) + "A" + r + " " + r + " 0 " + large + " 1 " + e[0].toFixed(2) + " " + e[1].toFixed(2);
  }
  function chartDonut(items, centerLabel) {
    const total = sum(items, (i) => i.value);
    if (!total) return '<div class="empty" style="padding:28px 10px"><p>No costs recorded in this period</p></div>';
    const R = 78, r = 54, cx = 90, cy = 90;
    let a = -Math.PI / 2, g = "";
    items.forEach((it) => {
      if (it.value <= 0) return;
      const ang = (it.value / total) * Math.PI * 2;
      const a1 = a + Math.max(ang, 0.02);
      g += '<path d="' + arcPath(cx, cy, R, a, a1) + "L" + (cx + r * Math.cos(a1)).toFixed(2) + " " + (cy + r * Math.sin(a1)).toFixed(2) +
        arcPath(cx, cy, r, a1, a).replace("M", "L") + 'Z" fill="' + it.color + '" opacity=".95"><title>' + esc(it.label + ": " + money(it.value) + " (" + Math.round(pct(it.value, total)) + "%)") + "</title></path>";
      a = a1;
    });
    g += '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" style="font-size:16px;font-weight:700;fill:var(--text)">' + compact(total) + "</text>";
    g += '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" style="font-size:9.5px;letter-spacing:.6px">' + esc(centerLabel || "TOTAL COST") + "</text>";
    const legend = items.filter((i) => i.value > 0).map((i) =>
      '<div class="dl"><i style="width:9px;height:9px;border-radius:3px;background:' + i.color + '"></i><span>' + esc(i.label) + "</span><b>" + compact(i.value) + "</b></div>").join("");
    return '<div class="donut-wrap"><svg class="chart-svg" viewBox="0 0 180 180" style="width:172px;height:172px;flex:0 0 auto">' + g + '</svg><div class="donut-legend">' + legend + "</div></div>";
  }
  function sparkline(values, color) {
    if (values.length < 2) return "";
    const max = Math.max.apply(null, values) || 1, min = Math.min.apply(null, values);
    const W = 90, H = 24;
    const pts = values.map((v, i) => [(W * i) / (values.length - 1), H - 2 - ((v - min) / (max - min || 1)) * (H - 6)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    return '<svg viewBox="0 0 ' + W + " " + H + '" style="width:90px;height:24px;overflow:visible"><path d="' + d + '" fill="none" stroke="' + (color || "var(--primary)") + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  /* ============================================================== alerts */
  function computeAlerts() {
    const out = [];
    db.trucks.forEach((t) => {
      const docs = [["insuranceExpiry", "Insurance"], ["fitnessExpiry", "Fitness"], ["permitExpiry", "Permit"], ["pollutionExpiry", "PUC"]];
      docs.forEach(([k, label]) => {
        if (!t[k]) return;
        const d = daysFromToday(t[k]);
        if (d < 0) out.push({ sev: "red", ic: "doc", title: t.regNo + " — " + label + " expired", detail: "Expired " + Math.abs(d) + " day" + (Math.abs(d) === 1 ? "" : "s") + " ago", view: "trucks", id: t.id });
        else if (d <= 30) out.push({ sev: "amber", ic: "doc", title: t.regNo + " — " + label + " expiring", detail: "Due in " + d + " day" + (d === 1 ? "" : "s"), view: "trucks", id: t.id });
      });
      const due = db.maint.filter((m) => m.truckId === t.id && m.nextDueDate).sort((a, b) => (a.nextDueDate > b.nextDueDate ? -1 : 1))[0];
      if (due) {
        const d = daysFromToday(due.nextDueDate);
        if (d < 0) out.push({ sev: "red", ic: "tool", title: t.regNo + " — service overdue", detail: (due.category || "Service") + " was due " + Math.abs(d) + "d ago", view: "maint", id: t.id });
        else if (d <= 15) out.push({ sev: "amber", ic: "tool", title: t.regNo + " — service due", detail: (due.category || "Service") + " due in " + d + "d", view: "maint", id: t.id });
      }
    });
    db.drivers.forEach((d) => {
      if (d.active === false || !d.licenseExpiry) return;
      const dd = daysFromToday(d.licenseExpiry);
      if (dd < 0) out.push({ sev: "red", ic: "user", title: d.name + " — licence expired", detail: "Expired " + Math.abs(dd) + "d ago", view: "drivers", id: d.id });
      else if (dd <= 30) out.push({ sev: "amber", ic: "user", title: d.name + " — licence expiring", detail: "Due in " + dd + "d", view: "drivers", id: d.id });
    });
    const credit = num(db.settings.creditDays) || 30;
    db.trips.forEach((t) => {
      if (!isDelivered(t)) return;
      const bal = tripBalance(t);
      if (bal <= 0.5 || !t.endDate) return;
      const over = -daysFromToday(addDays(t.endDate, credit));
      if (over > 0) out.push({ sev: "red", ic: "receipt", title: custName(t.customerId) + " — payment overdue", detail: money(bal) + " pending " + over + "d past due (" + (t.code || "trip") + ")", view: "payments", id: t.id });
    });
    /* CRM: promised-but-missed follow-ups */
    db.activities.forEach((a) => {
      if (!a.nextDate || a.done) return;
      const d = daysFromToday(a.nextDate);
      if (d < 0) out.push({ sev: d <= -2 ? "red" : "amber", ic: "calendar", title: custName(a.customerId) + " — follow-up missed", detail: (a.type || "Call") + " was due " + Math.abs(d) + "d ago", view: "followups", id: a.id });
      else if (d === 0) out.push({ sev: "blue", ic: "calendar", title: custName(a.customerId) + " — follow-up today", detail: a.type || "Call", view: "followups", id: a.id });
    });
    /* CRM: credit control */
    db.customers.forEach((c) => {
      const cr = custCredit(c.id);
      if (cr.over) out.push({ sev: "red", ic: "wallet", title: c.name + " — over credit limit", detail: money(cr.used) + " outstanding against a " + money(cr.limit) + " limit", view: "customers", id: c.id });
      if (c.hold) out.push({ sev: "amber", ic: "lock", title: c.name + " — account on hold", detail: "New orders are blocked until the hold is lifted", view: "customers", id: c.id });
    });
    const order = { red: 0, amber: 1, blue: 2 };
    return out.sort((a, b) => order[a.sev] - order[b.sev]);
  }

    return '<div class="kpi" style="--kpi-c:' + o.color + ";--kpi-soft:" + o.soft + ";--kpi-ink:" + ink + '">' +
      '<div class="kpi-top"><div class="kpi-ic">' + I(o.icon) + '</div><div class="kpi-lbl">' + esc(o.label) + "</div></div>" +
      '<div class="kpi-val">' + o.value + "</div>" +
      '<div class="kpi-sub">' + (o.sub || "") + "</div></div>";
  }
  function trendChip(now, prev) {
    if (!prev) return '<span class="trend flat">new</span>';
    const d = ((now - prev) / Math.abs(prev)) * 100;
    const up = d >= 0;
    return '<span class="trend ' + (Math.abs(d) < 0.5 ? "flat" : up ? "up" : "down") + '">' + (up ? "▲" : "▼") + " " + Math.abs(d).toFixed(0) + "%</span>";
  }

  function aiDashCard() {
    var ins = AI.insights || aiInsightsCached();
    var ready = AI.state === "ready";
    var state = AI.state;
    var hint = state === "ready" ? "Personalised from today's numbers"
      : state === "signed-out" ? "Sign in to Puter to switch this on"
        : state === "insecure" ? "Sign in from a web link to switch this on"
          : state === "unavailable" ? "Puter is offline — everything else still works"
            : "Just a moment…";
    var body;
    if (AI.busy === "insights") {
      body = '<div class="ai-typing" style="padding:4px 0"><i></i><i></i><i></i></div><p class="sm muted" style="margin-top:8px">Reading your fleet data…</p>';
    } else if (ins && ins.text) {
      body = mdLite(ins.text) + '<div class="ai-cap">' + I("clock", "sm") + " " + fmtDate(new Date(ins.ts).toISOString().slice(0, 10)) + " · from your live records</div>";
    } else {
      body = '<p class="sm muted" style="line-height:1.6">Four number-backed suggestions to earn or save money this week — money sitting with customers, idle trucks, fuel outliers and repairs.</p>';
    }
    return '<div class="card mb" style="border-color:var(--gold-rule);background:linear-gradient(105deg,var(--gold-soft),var(--panel) 42%)">' +
      '<div class="card-h"><div class="row" style="gap:9px"><div class="ai-mark" style="width:28px;height:28px;border-radius:9px">' + I("sparkle", "sm") + "</div>" +
      '<div><h3 style="line-height:1.2">AI insights</h3><span class="sub">' + esc(hint) + "</span></div></div>" +
      '<div class="right" style="gap:7px">' +
      (state === "signed-out" ? '<button class="btn sm primary" data-act="ai-signin">' + I("sparkle", "sm") + " Sign in</button>" : "") +
      '<button class="btn sm" data-act="ai-insights"' + (ready ? "" : " disabled") + ">" + I("sparkle", "sm") + (ins ? " Refresh" : " Generate") + "</button>" +
      '<button class="btn sm ghost" data-act="ai-chat-open">Ask copilot ' + I("arrow_right", "sm") + "</button></div></div>" +
      '<div class="card-b"><div class="ai-res">' + body + "</div></div></div>";
  }

  RENDER.dashboard = function () {
    const m = thisMonth(), pm = addMonthsKey(m, -1);
    const active = db.trips.filter(isActiveTrip);
    const idle = db.trucks.filter((t) => truckState(t).key === "idle").length;
    const rev = revenueIn(m), revP = revenueIn(pm);
    const col = sum(paymentsIn(m), (p) => num(p.amount)), colP = sum(paymentsIn(pm), (p) => num(p.amount));
    const fuel = sum(dieselIn(m), (d) => num(d.amount));
    const serv = sum(maintIn(m), (x) => num(x.cost));
    const oth = sum(expensesIn(m), (x) => num(x.amount));
    const out = outstandingTotal();
    const freightTransit = sum(active, (t) => num(t.freight));

    if (!db.trucks.length && !db.trips.length) return onboarding();

    let html = '<div class="toolbar" style="margin-bottom:16px">' +
      '<span class="sm muted" style="font-weight:600">Quick actions</span>' +
      '<div class="right" style="margin-left:0;gap:7px">' +
      ['new-trip|plus|Book trip', 'add-diesel|fuel|Log diesel', 'add-payment|receipt|Collect payment', 'add-maint|tool|Service job', 'add-expense|wallet|Add expense']
        .map((x) => { const p = x.split("|"); return '<button class="btn sm" data-act="' + p[0] + '">' + I(p[1], "sm") + " " + p[2] + "</button>"; }).join("") +
      "</div></div>";

    /* 6-month series */
    const keys = [], labels = [];
    for (let i = 5; i >= 0; i--) { const k = addMonthsKey(m, -i); keys.push(k); labels.push(monthLabel(k)); }
    const revSeries = keys.map((k) => revenueIn(k));
    const costSeries = keys.map((k) => sum(dieselIn(k), (d) => num(d.amount)) + sum(maintIn(k), (x) => num(x.cost)) + sum(expensesIn(k), (x) => num(x.amount)));
    const collSeries = keys.map((k) => sum(paymentsIn(k), (p) => num(p.amount)));

    const alerts = computeAlerts();
    const reds = alerts.filter((a) => a.sev === "red").length;

    html += '<div class="grid g-kpi mb">';
    html += kpiCard({
      label: "Fleet", icon: "truck", color: "var(--gold)", ink: "var(--gold-ink)", soft: "var(--gold-soft)", value: db.trucks.length,
      sub: '<b>' + (db.trucks.length - idle) + "</b> engaged · <b>" + idle + "</b> available",
    });
    html += kpiCard({
      label: "On road", icon: "route", color: "var(--sapphire)", ink: "var(--primary)", soft: "var(--blue-soft)", value: active.length,
      sub: active.length ? "Freight in motion <b>" + compact(freightTransit) + "</b>" : "No truck on the road",
    });
    html += kpiCard({
      label: "Revenue", icon: "chart", color: "var(--emerald)", ink: "var(--green)", soft: "var(--green-soft)", value: compact(rev),
      sub: "<span>" + monthLabel(m) + "</span>" + trendChip(rev, revP) + "<span>vs " + monthLabel(pm) + "</span>",
    });
    html += kpiCard({
      label: "Collected", icon: "receipt", color: "var(--turquoise)", ink: "var(--teal)", soft: "var(--teal-soft)", value: compact(col),
      sub: "<span>" + monthLabel(m) + "</span>" + trendChip(col, colP) + "<span>of " + compact(rev) + "</span>",
    });
    html += kpiCard({
      label: "Running cost", icon: "fuel", color: "var(--saffron)", ink: "var(--amber)", soft: "var(--amber-soft)", value: compact(fuel + serv + oth),
      sub: "Fuel <b>" + compact(fuel) + "</b> · Other <b>" + compact(serv + oth) + "</b>",
    });
    html += kpiCard({
      label: "Receivable", icon: "wallet", color: reds ? "var(--vermillion)" : "var(--magenta)", ink: reds ? "var(--red)" : "var(--magenta-ink)", soft: reds ? "var(--red-soft)" : "var(--magenta-soft)",
      value: compact(out), sub: db.trips.filter((t) => t.status !== "cancelled" && tripBalance(t) > 0.5).length + " open bills" + (reds ? ' · <b style="color:var(--red)">' + reds + " overdue</b>" : ""),
    });
    html += "</div>";

    /* AI insight strip */
    html += aiDashCard();

    /* charts row */
    html += '<div class="grid g-23 mb">';
    html += '<div class="card"><div class="card-h"><h3>Earnings vs cost</h3><span class="sub">last 6 months</span>' +
      '<div class="right"><span class="badge b-gray">' + monthLabel(keys[0]) + " – " + monthLabel(keys[5]) + "</span></div></div>" +
      '<div class="card-b">' + chartBars(labels, [
        { name: "Freight billed", color: "var(--viz-1)", values: revSeries },
        { name: "Collected", color: "var(--viz-2)", values: collSeries },
        { name: "Running cost", color: "var(--viz-3)", values: costSeries },
      ]) + "</div></div>";
    html += '<div class="card"><div class="card-h"><h3>Cost split</h3><span class="sub">' + monthLabel(m) + "</span></div>" +
      '<div class="card-b">' + chartDonut([
        { label: "Diesel", value: fuel, color: "var(--viz-3)" },
        { label: "Maintenance", value: serv, color: "var(--viz-plum)" },
        { label: "Other", value: oth, color: "var(--viz-turq)" },
      ], monthLabel(m) + " COST") + "</div></div>";
    html += "</div>";

    /* alerts + fleet */
    html += '<div class="grid g-2 mb">';
    html += alertsCard();
    /* fleet status */
    const rows = db.trucks.slice().sort((a, b) => truckState(a).sort - truckState(b).sort).slice(0, 7);
    let fleetBody;
    if (!rows.length) {
      fleetBody = '<div class="empty" style="padding:28px"><p>No trucks yet.</p><button class="btn primary sm" data-act="add-truck">' + I("plus", "sm") + " Add truck</button></div>";
    } else {
      fleetBody = rows.map((t) => {
        const st = truckState(t), trip = db.trips.find((x) => x.truckId === t.id && isActiveTrip(x));
        const dv = driverById(t.driverId);
        return '<div class="frow" data-act="view-truck" data-id="' + t.id + '" style="cursor:pointer">' +
          '<div class="t-avatar">' + I("truck", "sm") + "</div>" +
          '<div style="min-width:0"><div class="freg">' + esc(t.regNo) + '</div><div class="fmeta">' + esc(dv ? dv.name : "No driver") +
          (trip ? " · " + esc(trip.from || "?") + "→" + esc(trip.to || "?") : " · idle") + "</div></div>" +
          '<div style="margin-left:auto;text-align:right"><span class="badge ' + st.cls + '">' + st.label + "</span>" +
          (trip ? '<div class="fmeta" style="margin-top:3px">' + esc(trip.code || "") + "</div>" : "") + "</div></div>";
      }).join("");
    }
    html += '<div class="card"><div class="card-h"><h3>Fleet status</h3><div class="right"><button class="btn ghost sm" data-act="nav" data-view="trucks">Manage ' + I("arrow_right", "sm") + "</button></div></div>" +
      '<div class="card-b tight">' + fleetBody + "</div></div>";
    html += "</div>";

    /* follow-ups + ageing */
    html += '<div class="grid g-2 mb">' + followupsCard() + ageingCard() + "</div>";

    /* activity + top customers */
    html += '<div class="grid g-2">';
    html += '<div class="card"><div class="card-h"><h3>Recent activity</h3></div><div class="card-b tight">' + activityList() + "</div></div>";
    html += '<div class="card"><div class="card-h"><h3>Top customers</h3><span class="sub">by freight billed</span></div><div class="card-b tight">' + topCustomers() + "</div></div>";
    html += "</div>";
    return html;
  };

  function activityList() {
    const items = [];
    db.trips.forEach((t) => items.push({ d: t.startDate || "", ic: "route", c: "var(--primary)", soft: "var(--blue-soft)", t: (t.code || "Trip") + " · " + custName(t.customerId), s: (t.from || "") + " → " + (t.to || ""), amt: num(t.freight) }));
    db.diesel.forEach((d) => items.push({ d: d.date, ic: "fuel", c: "var(--amber)", soft: "var(--amber-soft)", t: "Diesel " + num(d.litres).toFixed(0) + "L · " + truckName(d.truckId), s: d.station || "Fuel station", amt: -num(d.amount) }));
    db.maint.forEach((m) => items.push({ d: m.date, ic: "tool", c: "var(--purple)", soft: "var(--purple-soft)", t: (m.category || "Service") + " · " + truckName(m.truckId), s: m.description || m.vendor || "", amt: -num(m.cost) }));
    db.payments.forEach((p) => items.push({ d: p.date, ic: "receipt", c: "var(--green)", soft: "var(--green-soft)", t: "Payment from " + custName(p.customerId), s: (p.mode || "Cash") + (p.ref ? " · " + p.ref : ""), amt: num(p.amount) }));
    db.expenses.forEach((e) => items.push({ d: e.date, ic: "wallet", c: "var(--teal)", soft: "var(--teal-soft)", t: (e.category || "Expense") + " · " + (e.truckId ? truckName(e.truckId) : "General"), s: e.notes || "", amt: -num(e.amount) }));
    items.sort((a, b) => (a.d < b.d ? 1 : -1));
    const rows = items.slice(0, 8);
    if (!rows.length) return '<div class="empty" style="padding:30px"><p>No transactions recorded yet.</p></div>';
    return rows.map((i) =>
      '<div class="act-item"><div class="act-ic" style="background:' + i.soft + ";color:" + i.c + '">' + I(i.ic) + "</div>" +
      '<div style="min-width:0"><div class="t-main" style="font-size:12.8px">' + esc(i.t) + '</div><div class="t-sub">' + esc(i.s || "") + " · " + fmtDateShort(i.d) + "</div></div>" +
      '<div class="act-amt" style="color:' + (i.amt < 0 ? "var(--red)" : "var(--green)") + '">' + (i.amt < 0 ? "-" : "+") + compact(Math.abs(i.amt)) + "</div></div>").join("");
  }
  function topCustomers() {
    const rows = db.customers.map((c) => ({ c, v: sum(db.trips.filter((t) => t.customerId === c.id && t.status !== "cancelled"), (t) => num(t.freight)), out: custOutstanding(c.id) }))
      .filter((r) => r.v > 0).sort((a, b) => b.v - a.v).slice(0, 6);
    if (!rows.length) return '<div class="empty" style="padding:30px"><p>No customer revenue yet.</p></div>';
    const max = rows[0].v || 1;
    return rows.map((r) =>
      '<div class="frow"><div class="t-avatar">' + esc(initials(r.c.name)) + "</div>" +
      '<div style="min-width:0;flex:1"><div class="t-main" style="font-size:12.8px">' + esc(r.c.name) + '</div>' +
      '<div class="prog" style="margin-top:5px"><i style="width:' + Math.max(4, pct(r.v, max)).toFixed(0) + '%"></i></div></div>' +
      '<div style="text-align:right;margin-left:12px"><div class="mono" style="font-weight:650;font-size:12.6px">' + compact(r.v) + "</div>" +
      '<div class="t-sub">' + (r.out > 0.5 ? compact(r.out) + " due" : "settled") + "</div></div></div>").join("");
  }

  function onboarding() {
    return '<div class="card" style="max-width:760px;margin:6vh auto;text-align:center;padding:38px 30px">' +
      '<div class="brand-mark" style="width:58px;height:58px;border-radius:16px;margin:0 auto 16px;box-shadow:0 14px 34px -14px rgba(245,166,35,.9),inset 0 1px 0 rgba(255,255,255,.5)">' + I("truck", "lg") + "</div>" +
      '<h2 style="font-size:22px;letter-spacing:-.4px;margin-bottom:6px">Welcome to TruckOps</h2>' +
      '<p class="muted" style="max-width:520px;margin:0 auto 22px;font-size:13.5px;line-height:1.6">A complete transport office in one file: fleet and driver records, order booking with occupancy control, diesel and service logs, a customer CRM with follow-ups and credit limits, GST invoices, collections and profit reports — plus an AI copilot. Everything saves automatically in this browser.</p>' +
      '<div class="row" style="justify-content:center;flex-wrap:wrap;margin-bottom:26px">' +
      '<button class="btn primary" data-act="add-truck">' + I("plus", "sm") + " Add your first truck</button>" +
      '<button class="btn" data-act="demo">' + I("refresh", "sm") + " Load sample fleet</button></div>" +
      '<div class="grid g-3" style="text-align:left">' +
      [["truck", "1. Add trucks", "Registration, capacity, documents and the driver allotted."],
       ["route", "2. Book trips", "Occupied trucks are blocked — no double booking possible."],
       ["fuel", "3. Log daily ops", "Diesel, service, expenses and payments in seconds."],
       ["users", "4. Run the CRM", "Customer 360, follow-ups, credit limits and statements."],
       ["invoice", "5. Bill & collect", "GST invoices, ageing and one-click payment reminders."],
       ["chart", "6. See the money", "Profit per truck, per month — and an AI second opinion."]]
        .map((x) => '<div style="background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:13px">' +
          '<div class="kpi-ic" style="margin-bottom:8px">' + I(x[0]) + '</div><div style="font-weight:640;font-size:13px">' + x[1] + '</div><div class="muted sm" style="margin-top:3px;line-height:1.45">' + x[2] + "</div></div>").join("") +
      "</div></div>";
  }

  /* =============================================================== trucks */
  const TRUCK_TYPES = ["Open body", "Closed container", "Trailer", "Tanker", "Tipper", "Reefer", "Flatbed"];
  const DOC_FIELDS = [["insuranceExpiry", "Insurance"], ["fitnessExpiry", "Fitness"], ["permitExpiry", "Permit"], ["pollutionExpiry", "PUC"]];

  function searchBox(v, ph) {
    return '<div class="search">' + I("search") + '<input type="search" placeholder="' + esc(ph) + '" value="' + esc(ui.q[v] || "") + '" data-act="search" data-view="' + v + '"></div>';
  }
  function noRows(cols, msg, btn) {
    return '<tr><td colspan="' + cols + '"><div class="empty"><div class="e-ic">' + I("box") + "</div><h4>Nothing here yet</h4><p>" + msg + "</p>" + (btn || "") + "</div></td></tr>";
  }
  function truckStats(tid) {
    const rev = sum(db.trips.filter((x) => x.truckId === tid && x.status === "delivered"), (x) => num(x.freight));
    const fuel = sum(db.diesel.filter((d) => d.truckId === tid), (d) => num(d.amount));
    const serv = sum(db.maint.filter((m) => m.truckId === tid), (m) => num(m.cost));
    const oth = sum(db.expenses.filter((e) => e.truckId === tid), (e) => num(e.amount));
    return { rev, fuel, serv, oth, cost: fuel + serv + oth, profit: rev - fuel - serv - oth, trips: db.trips.filter((x) => x.truckId === tid && x.status !== "cancelled").length };
  }

  RENDER.trucks = function () {
    const q = (ui.q.trucks || "").toLowerCase(), filt = ui.status.trucks || "all";
    let list = db.trucks.slice().sort((a, b) => truckState(a).sort - truckState(b).sort || (a.regNo > b.regNo ? 1 : -1));
    if (q) list = list.filter((t) => (t.regNo + " " + (t.model || "") + " " + (t.type || "") + " " + driverName(t.driverId)).toLowerCase().indexOf(q) >= 0);
    if (filt !== "all") list = list.filter((t) => truckState(t).key === filt);
    const st = { idle: 0, ontrip: 0, shop: 0, inactive: 0 };
    db.trucks.forEach((t) => st[truckState(t).key]++);

    let html = '<div class="chips">' +
      '<div class="chip">' + I("truck", "sm") + '<span class="c-v">' + db.trucks.length + '</span><span class="c-l">Trucks</span></div>' +
      '<div class="chip">' + I("route", "sm") + '<span class="c-v">' + st.ontrip + '</span><span class="c-l">Occupied</span></div>' +
      '<div class="chip">' + I("check", "sm") + '<span class="c-v">' + st.idle + '</span><span class="c-l">Available</span></div>' +
      '<div class="chip">' + I("tool", "sm") + '<span class="c-v">' + st.shop + '</span><span class="c-l">In workshop</span></div>' +
      '<div class="chip">' + I("user", "sm") + '<span class="c-v">' + db.drivers.filter((d) => d.active !== false).length + '</span><span class="c-l">Active drivers</span></div>' +
      "</div>";
    html += '<div class="toolbar">' + searchBox("trucks", "Search reg. no, model, driver…") +
      '<select class="pick" data-act="filter-trucks">' +
      [["all", "All statuses"], ["ontrip", "Occupied"], ["idle", "Available"], ["shop", "In workshop"], ["inactive", "Inactive"]]
        .map((o) => '<option value="' + o[0] + '"' + (filt === o[0] ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select>" +
      '<div class="right"><button class="btn" data-act="export-trucks">' + I("download", "sm") + ' Export</button>' +
      '<button class="btn primary" data-act="add-truck">' + I("plus", "sm") + " Add truck</button></div></div>";

    html += '<div class="card"><div class="card-b tight"><div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      "<th>Truck</th><th>Driver allotted</th><th>Occupancy</th><th>Next document</th><th class=\"r\">Capacity</th><th class=\"r\">Odometer</th><th class=\"r\">Trips</th><th class=\"r\">Net earnings</th><th></th></tr></thead><tbody>";
    if (!list.length) {
      html += noRows(9, db.trucks.length ? "No truck matches this filter." : "Add your first truck to start booking trips and logging diesel.", '<button class="btn primary sm" data-act="add-truck">' + I("plus", "sm") + " Add truck</button>");
    } else {
      list.forEach((t) => {
        const s = truckState(t), p = truckStats(t.id), trip = db.trips.find((x) => x.truckId === t.id && isActiveTrip(x));
        const dv = driverById(t.driverId);
        const docs = DOC_FIELDS.map(([k, l]) => ({ k, l, d: t[k] })).filter((x) => x.d).sort((a, b) => (a.d < b.d ? -1 : 1));
        const nextDoc = docs[0];
        html += "<tr>" +
          '<td><div class="cellflex"><div class="t-avatar">' + I("truck", "sm") + '</div><div><div class="t-main mono">' + esc(t.regNo) + "</div>" +
          '<div class="t-sub">' + esc([t.model, t.type].filter(Boolean).join(" · ") || "—") + "</div></div></div></td>" +
          "<td>" + (dv ? '<div class="t-main" style="font-weight:550">' + esc(dv.name) + '</div><div class="t-sub">' + esc(dv.phone || "") + "</div>" : '<span class="badge b-amber">No driver</span>') + "</td>" +
          '<td><span class="badge ' + s.cls + '">' + s.label + "</span>" + (trip ? '<div class="t-sub">' + esc((trip.code || "") + " → " + (trip.to || "")) + "</div>" : "") + "</td>" +
          "<td>" + (nextDoc ? '<div class="t-sub" style="margin:0 0 1px">' + nextDoc.l + "</div>" + dueBadge(nextDoc.d) : '<span class="muted">—</span>') + "</td>" +
          '<td class="r mono">' + (t.capacity ? num(t.capacity) + " T" : "—") + "</td>" +
          '<td class="r mono">' + (t.odometer ? INR.format(num(t.odometer)) + " km" : "—") + "</td>" +
          '<td class="r mono">' + p.trips + "</td>" +
          '<td class="r mono ' + (p.profit < 0 ? "neg" : "pos") + '">' + compact(p.profit) + "</td>" +
          '<td><div class="act">' +
          '<button class="btn sm icon ghost" title="View" data-act="view-truck" data-id="' + t.id + '">' + I("eye", "sm") + "</button>" +
          '<button class="btn sm icon ghost" title="Edit" data-act="edit-truck" data-id="' + t.id + '">' + I("edit", "sm") + "</button>" +
          '<button class="btn sm icon ghost" title="Delete" data-act="del-truck" data-id="' + t.id + '">' + I("trash", "sm") + "</button>" +
          "</div></td></tr>";
      });
    }
    html += "</tbody></table></div></div></div>";
    return html;
  };

  function truckForm(id) {
    const t = id ? truckById(id) : null;
    const driverOpts = [{ v: "", t: "— No driver allotted —" }].concat(
      db.drivers.filter((d) => d.active !== false).map((d) => ({ v: d.id, t: d.name + (driverBusy(d.id) && (!t || t.driverId !== d.id) ? "  (on a trip)" : "") })));

  const ONES = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
  const TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
  function inWords(amount) {
    let n = Math.round(Math.abs(num(amount)));
    if (!n) return "Zero rupees only";
    const two = (x) => (x < 20 ? ONES[x] : TENS[Math.floor(x / 10)] + (x % 10 ? " " + ONES[x % 10] : ""));
    const three = (x) => (x > 99 ? ONES[Math.floor(x / 100)] + " Hundred" + (x % 100 ? " " + two(x % 100) : "") : two(x));
    const parts = [];
    const cr = Math.floor(n / 10000000); n %= 10000000;
    const la = Math.floor(n / 100000); n %= 100000;
    const th = Math.floor(n / 1000); n %= 1000;
    if (cr) parts.push(three(cr) + " Crore");
    if (la) parts.push(three(la) + " Lakh");
    if (th) parts.push(three(th) + " Thousand");
    if (n) parts.push(three(n));
    return parts.join(" ").replace(/\s+/g, " ").trim() + " rupees only";
  }
  function taxBreakup(amount, customer) {
    const rate = num(db.settings.gstRate);
    if (!rate) return null;
    const taxable = amount / (1 + rate / 100);
    const tax = amount - taxable;
    const homeState = String(db.settings.state || "").trim().toLowerCase();
    const awayState = String((customer && customer.state) || "").trim().toLowerCase();
    const inter = !!homeState && !!awayState && homeState !== awayState;
    return { rate: rate, taxable: taxable, tax: tax, inter: inter, cgst: inter ? 0 : tax / 2, sgst: inter ? 0 : tax / 2, igst: inter ? tax : 0 };
  }

  function custAgeing(cid) {
    const c = custById(cid), cd = custCreditDays(c);
    const b = [0, 0, 0, 0, 0];
    db.trips.forEach((t) => {
      if (t.customerId !== cid || t.status === "cancelled") return;
      const bal = tripBalance(t);
      if (bal <= 0.5) return;
      const od = -daysFromToday(addDays(t.endDate || t.startDate, cd));
      b[od <= 0 ? 0 : od <= 30 ? 1 : od <= 60 ? 2 : od <= 90 ? 3 : 4] += bal;
    });
    return b;
  }

          }

  function paymentForm(id, pre) {
    if (!id && pre) PENDING_PRE = pre;
    preset = preset || {};

    if (!db.customers.length) { toast("Add a customer first", "red"); setTimeout(() => customerForm(null), 120); return; }

      const due = custOutstanding(c.id);
      return { v: c.id, t: c.name + (due > 0.5 ? " — " + compact(due) + " due" : "") };
    });
    const curCust = p ? p.customerId : preset.customerId || (db.customers[0] || {}).id;

      const open = db.trips.filter((t) => t.customerId === curCust && t.status !== "cancelled" && (tripBalance(t) > 0.5 || (p && p.tripId === t.id)));
      open.sort((a, b) => tripBalance(b) - tripBalance(a));

    };
    const presetTrip = p ? p.tripId || "" : preset.tripId || firstOpen();
    const tripOptsFor = (cid) => {
      const open = db.trips.filter((t) => t.customerId === cid && t.status !== "cancelled" && (tripBalance(t) > 0.5 || (p && p.tripId === t.id)));
      return [{ v: "", t: open.length ? "— On account (no specific trip) —" : "— No open trip —" }].concat(
        open.map((t) => ({ v: t.id, t: t.code + " · " + (t.from || "") + "→" + (t.to || "") + " · due " + money(tripBalance(t)) })));
    };
    const body = '<div class="form-grid">' +
      fText("date", "Payment date", p ? p.date : todayISO(), { type: "date", req: true }) +
      fSelect("customerId", "Customer", custOpts, curCust, { req: true }) +
      fSelect("tripId", "Against trip", tripOptsFor(curCust), presetTrip, { wide: true, hint: "Leave blank to book as on-account credit" }) +
      fNum("amount", "Amount received", p ? p.amount : preset.amount || "", { step: "1", req: true, autofocus: true, placeholder: "45000" }) +
      fSelect("mode", "Mode", PAY_MODES, p ? p.mode : "Bank transfer") +

      fArea("notes", "Notes", p ? p.notes : "") +
      "</div>";

      title: id ? "Edit payment" : "Record payment", subtitle: "Money collected against orders", size: "wide", body: body,
      submitLabel: id ? "Save changes" : "Record payment",

        const cs = form.querySelector('[name="customerId"]'), ts = form.querySelector('[name="tripId"]'), am = form.querySelector('[name="amount"]');
        cs.addEventListener("change", () => {

        });
        ts.addEventListener("change", () => {
          const t = tripById(ts.value);
          if (t && !am.value) am.value = Math.round(tripBalance(t));
        });

        if (t0 && !am.value) am.value = Math.round(tripBalance(t0));
      },
      onSubmit: (f, form) => {

          amount: num(f.amount), mode: f.mode, ref: f.ref, notes: f.notes, createdAt: (p && p.createdAt) || todayISO(),
        });
        if (id) db.payments[db.payments.findIndex((x) => x.id === id)] = rec; else db.payments.push(rec);
        saveDB(); render(); toast("Payment of " + money(rec.amount) + " recorded", "green");

      },
